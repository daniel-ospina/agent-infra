name: ambient-interior
version: '1.0'
description: Restaurant, bar, café interior spaces — no faces
byline: false
prompt_prefix: 'Photorealistic architectural interior photography. Shot on 35mm lens,
  DSLR. Natural depth with foreground/background separation.


  COMPOSITION: Rule of thirds. Focal point in upper or middle third. Text zone at
  bottom where surfaces are darkest.


  LIGHTING: Natural daylight through windows or practical interior lighting. Mixed
  light temperatures — warm bulbs, cooler ambient. Realistic shadows. AVOID golden
  hour, AVOID glowing lightbulbs, AVOID lens flare, AVOID dramatic HDR.


  TEXTURE: High-detail surfaces. Wood grain, paint texture, fabric weave, metal patina.
  Slight imperfections: minor scuffs, uneven wear, dust motes in sunbeams. Lived-in
  feel — not sterile, not showroom, not perfectly clean.


  COLOUR: Muted tones, earthy palette, natural colour grading. NOT vibrant. NOT saturated.


  CAMERA: 35mm lens, DSLR or mirrorless. Subtle film grain. ISO 400-800. Not clinical.
  Not HDR.


  BACKGROUND REALISM: Real space, not staged. Uneven lighting. Some chairs slightly
  pulled out, a tablecloth not perfectly straight, a poster slightly crooked. Depth
  falloff: distant objects softer and darker.'
prompt_suffix: 'NO glowing lightbulbs. NO lens flare. NO HDR. NO golden hour.

  NO CGI. NO 3D render. NO game engine. NO plastic surfaces.

  NO floating objects. NO impossible architecture. NO fake reflections.

  NO uniformly lit spaces. NO empty sterile rooms. NO AI artifacts.

  NO visible text. NO words. NO labels.'
reference_images: []
quality_checks:
  auto_reject:
  - composition_balance
  - no_ai_hallucination
  warn:
  - lighting_consistency
  - background_realism
scrim:
  type: medium-purple
model_preference:
  primary: google/gemini-3.1-flash-image-preview
  fallback: black-forest-labs/flux-2-klein
image_config:
  aspect_ratio: '1:1'
  image_size: 2K
