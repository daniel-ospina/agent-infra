name: Node.js CI
# Reusable workflow — Node.js CI (script validate, skill lint, typecheck, lint, unit-test)
# Source: agent-infra/templates/.github/workflows/node-ci.yml
# Called via: uses: daniel-ospina/agent-infra/.github/workflows/node-ci.yml@<ref>
# Version contract (#303): consumers pin a semver tag (e.g. @v0.1.0); only
# agent-infra's own self-caller uses @main (same-commit, no tag-before-merge).
# Materialized to .github/workflows/ by scripts/sync-ci-workflows.sh (real
# files only — GitHub Actions CANNOT parse symlinked workflow files, #555).
# Budget: PR-only (shared Actions budget under daniel-ospina account)
#
# #387 — unit-test capability + skip-input contract:
#   * unit-test job runs when test-command OR test-glob is set ('' = skip).
#     test-command is an escape hatch (npm ci && vitest, npx tsx suites,
#     failure accumulators) and OVERRIDES test-glob when both are set.
#     test-command MUST NOT contain Actions expression syntax (dollar-brace-brace).
#   * script-validate / skill-lint are boolean skip inputs, default true
#     (backward-compatible: existing callers keep both gates). Consumers
#     with a broken-on-runner scripts/ symlink (e.g. tortoise) or no
#     scripts/check-skill-lint.mjs (un-bootstrapped) MUST pass false.
#     default:true is load-bearing — boolean workflow_call inputs default
#     to FALSE when unset, which would silently disable the #254 gate.
#   * typecheck/lint self-skip on missing config (no force-skip inputs —
#     test-only consumers with configs use test-command). The no-config
#     branch is emitted as a ::warning:: annotation so "linted" and
#     "skipped" are distinguishable in the checks UI (#1128).
#   * Skip is observable via the callee run log (job-level if: skip lists
#     the job as skipped).
#
# #1128 — lint/typecheck honour the CALLER's package directory:
#   * both jobs ran at the repo root (no working-directory), so for a caller
#     whose package lives in a subdirectory the `[ -f eslint.config.js ]`
#     guard was false, the job printed "No ESLint config found — skipping
#     lint" and PASSED. A green required check that certifies nothing.
#   * lint now (a) runs in inputs.working-directory, (b) installs the
#     package's own deps when it carries a package-lock.json — `npx eslint`
#     alone resolves neither the config's `globals`/plugin imports nor its
#     parser, so a nested package failed with ERR_MODULE_NOT_FOUND instead
#     of linting, and (c) annotates the skip.
#   * the input defaults to '.' (repo root); a caller that does not set it is
#     in the same directory as before. The only behavioural gain for such a
#     caller is the dependency install below, and only when it already has a
#     lint/tsconfig file plus a package-lock.json in that directory.
#   * the config-probe list covers every flat-config filename ESLint accepts
#     (js/mjs/cjs/ts/mts/cts), not just the two original spellings.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      working-directory:
        type: string
        default: '.'
        description: Package directory for the typecheck, lint and unit-test jobs (#1128). Default '.' = repo root.
      test-glob:
        type: string
        default: ''
        description: Glob passed to `node --test` (e.g. 'src/*.test.js'). '' + test-command '' = job skipped.
      test-command:
        type: string
        default: ''
        description: Escape hatch — arbitrary test invocation (e.g. 'npm ci && vitest run', npx tsx suites, failure accumulators). OVERRIDES test-glob when both set. MUST NOT contain Actions expression syntax (dollar-brace-brace); plain shell only.
      script-validate:
        type: boolean
        default: true
        description: Run the script-validate job. Pass false for consumers with a broken-on-runner scripts/ symlink (skip observable via callee run log).
      skill-lint:
        type: boolean
        default: true
        description: Run the skill-lint job (#254 fail-closed). Pass false for un-bootstrapped consumers without scripts/check-skill-lint.mjs (skip observable via callee run log).

jobs:
  script-validate:
    if: inputs.script-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Node.js scripts
        run: |
          errors=0
          for f in scripts/*.{cjs,mjs,js} bin/*.js; do
            [ -f "$f" ] || continue
            echo "Checking $f..."
            node --check "$f" || errors=$((errors+1))
          done
          if [ $errors -gt 0 ]; then
            echo "❌ $errors script(s) failed validation"
            exit 1
          fi
          echo "✅ All scripts validated"

  skill-lint:
    if: inputs.skill-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill YAML frontmatter
        run: |
          # #254 — fail-closed flip (D9): the frontmatter validator is a
          # required gate. A missing script is a broken gate, not a skip.
          if [ -f scripts/check-skill-lint.mjs ]; then
            node scripts/check-skill-lint.mjs
          else
            echo "❌ scripts/check-skill-lint.mjs not found — missing required gate, FAILING (#254)"
            echo "   If this repo is NOT agent-infra-bootstrapped (no scripts/ symlink), pass skill-lint: false"
            echo "   in the node-ci.yml call (#387). A bootstrapped repo missing the gate is a real failure."
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: TypeScript type check
        working-directory: ${{ inputs.working-directory }}
        env:
          # Caller input is passed through the environment, never interpolated
          # into the shell string (same discipline as the unit-test job).
          TSC_DIR: ${{ inputs.working-directory }}
        run: |
          if [ -f tsconfig.json ]; then
            # #1128 — same bare-checkout resolution gap as the lint job: `npx
            # tsc` alone cannot resolve the package's own `typescript` or
            # `@types/*` from the package tree, so the run dies with a module
            # error instead of type-checking.
            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund
            fi
            npx tsc --noEmit
          else
            echo "::warning::No tsconfig.json in $TSC_DIR — typecheck SKIPPED (#1128)"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: ESLint
        # #1128 — the caller's package dir, not the repo root. Without this a
        # nested package found no config, printed the skip below and passed.
        working-directory: ${{ inputs.working-directory }}
        env:
          LINT_DIR: ${{ inputs.working-directory }}
        run: |
          if [ -f eslint.config.mjs ] || [ -f eslint.config.js ] || [ -f eslint.config.cjs ] || \
             [ -f eslint.config.ts ] || [ -f eslint.config.mts ] || [ -f eslint.config.cts ] || \
             [ -f .eslintrc.js ] || [ -f .eslintrc.json ]; then
            # #1128 — a flat config imports real packages (`globals`,
            # `eslint-plugin-*`) and eslint itself is a devDependency. `npx
            # eslint .` on a bare checkout installs eslint from the registry
            # but resolves NEITHER of those from the package tree, so the run
            # died with ERR_MODULE_NOT_FOUND instead of linting. Install the
            # package's own deps first when it carries a lockfile. This only
            # runs in the config-found branch: a caller with no config is
            # untouched.
            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund
            fi
            npx eslint .
          else
            echo "::warning::No ESLint config in $LINT_DIR — lint SKIPPED, this job certifies nothing (#1128)"
          fi

  unit-test:
    # #387 — reusable unit-suite runner. Job-level if: skip + step-level if:
    # branch selection (test-command wins when both set). NO shell
    # interpolation of the command (a quoted interpolation breaks any
    # command containing quotes — the failure-accumulator case).
    runs-on: ubuntu-latest
    if: inputs.test-command != '' || inputs.test-glob != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Custom test command
        if: inputs.test-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}
      - name: Glob-based node --test
        if: inputs.test-command == '' && inputs.test-glob != ''
        working-directory: ${{ inputs.working-directory }}
        run: node --test ${{ inputs.test-glob }}
