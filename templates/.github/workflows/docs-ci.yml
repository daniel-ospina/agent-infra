name: Docs CI
# Reusable workflow — Documentation CI (markdownlint, lychee link check, frontmatter)
# Source: agent-infra/templates/.github/workflows/docs-ci.yml
# Called via: uses: daniel-ospina/agent-infra/.github/workflows/docs-ci.yml@<ref>
# Version contract (#303): consumers pin a semver tag (e.g. @v0.1.0). A
# workflow change lands in consumers by an explicit version bump — never @main.
# Materialized to .github/workflows/ by scripts/sync-ci-workflows.sh (real
# files only — GitHub Actions CANNOT parse symlinked workflow files, #555).
# Budget: PR-only (shared Actions budget under daniel-ospina account)
#
# Inputs:
#   markdownlint-command  markdownlint invocation (repo config respected in CWD).
#                         '' = skip the markdownlint job.
#   link-check-args       lychee args. '' = skip the link-check job.
#   frontmatter-command   doc frontmatter validator invocation. '' = skip.
#   node-version          Node version for setup-node.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      markdownlint-command:
        type: string
        default: "npx markdownlint-cli '**/*.md' --ignore node_modules --ignore .git"
      link-check-args:
        type: string
        default: "--no-progress './**/*.md'"
      frontmatter-command:
        type: string
        default: 'node scripts/check-doc-affiliation.cjs --all'

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    # #2055 — an unbounded job can hang until the platform's 6-hour ceiling. These three jobs are a
    # REUSABLE workflow shipped to consumer repos, so the derivation cannot be "this repo's p90":
    # measured, the in-repo `push` trigger was removed 2026-08-24 and those runs' job records are
    # gone (`/actions/runs/32717466822/jobs` → `total_count: 0`), so there is no local distribution
    # to take a p90 from. The bound is therefore a stated CEILING for an ARBITRARY consumer's docs
    # tree — the work is one npm-installed linter over a consumer-chosen glob, which is seconds on a
    # small tree and minutes on a large one. 20 min is generous enough not to false-block a big
    # consumer and far below the 6-hour default a hang would otherwise get.
    timeout-minutes: 20
    if: inputs.markdownlint-command != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: ${{ inputs.markdownlint-command }}

  link-check:
    runs-on: ubuntu-latest
    # #2055 — the slowest of the three by construction: `lychee` walks EVERY link in the consumer's
    # docs and resolves each one over the network, so its wall clock is a function of the consumer's
    # link count and of remote servers' latency, not of this repo's code. Same measurement basis as
    # `markdownlint` above (no local distribution exists). 30 min: wide enough that a large docs tree
    # against slow external hosts is not false-blocked, finite so a wedged DNS resolver ends the job.
    timeout-minutes: 30
    if: inputs.link-check-args != ''
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: ${{ inputs.link-check-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontmatter:
    runs-on: ubuntu-latest
    # #2055 — the same ceiling basis as its two siblings: a consumer-supplied command over a
    # consumer's tree, with no local distribution to size from. It runs one script over the docs
    # (`check-doc-affiliation.cjs` when present) — the cheapest of the three, so the tightest bound.
    timeout-minutes: 15
    if: inputs.frontmatter-command != ''
    steps:
      - uses: actions/checkout@v4
      - name: Validate doc frontmatter
        run: |
          if [ -f scripts/check-doc-affiliation.cjs ]; then
            ${{ inputs.frontmatter-command }}
          else
            echo "⚠️  scripts/check-doc-affiliation.cjs not found — skipping"
          fi
