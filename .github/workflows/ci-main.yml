name: CI on main
# Post-merge safety net (issue #86): catches "PR A + PR B together break main"
# that per-PR review cannot see. Runs after every push to main.
#
# Hard gates (fail on error): extension tests + script validation + skill lint —
# deterministic and green today. skill-lint is the post-merge re-check; the
# per-PR hard gate runs in ci.yml → node-ci.yml (issue #237).
#
# On failure, a GitHub issue is auto-filed (no human gate — the AI review gate
# already guards merges; this is the post-merge backstop).

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  extension-tests:
    # #387 — dogfood the reusable capability (was: inline failure accumulator).
    # Stack gates skipped: ci-main keeps richer inline copies (bash -n + installer
    # tests #304, --skills-dir skill-lint) whose coverage node-ci jobs lack — keep
    # them. (No job duplication in practice: agent-infra has no root tsconfig/eslint,
    # so node-ci typecheck/lint self-skip; the unit-test job is the only new surface.)
    uses: daniel-ospina/agent-infra/.github/workflows/node-ci.yml@main
    with:
      node-version: '22'
      script-validate: false
      skill-lint: false
      test-command: |
        failures=0
        # #303 — pin-drift unit tests for the ci-ref check (bin/agent-infra.js surface).
        echo "== scripts/ci-ref-check.test.mjs =="
        node scripts/ci-ref-check.test.mjs || failures=$((failures+1))
        # #254 — frontmatter validator fixture-regression (post-merge, ci-main)
        echo "== scripts/check-skill-lint.test.mjs =="
        node scripts/check-skill-lint.test.mjs || failures=$((failures+1))
        for t in extensions/*/test*.mjs; do
          [ -f "$t" ] || continue
          echo "== $t =="
          node "$t" || failures=$((failures+1))
        done
        # shared/print-mode tests: the isPrintMode helper gates 17 sites (#228).
        # print-mode.test.ts covers helper logic; print-mode-wiring.test.ts
        # enforces the 0-raw-reads acceptance repo-wide; auto-sync.test.ts
        # exercises the FLAT-extension ./shared/ import path (the bug class
        # that shipped 2 files during this refactor's development).
        echo "== extensions/shared/print-mode.test.ts =="
        npx tsx extensions/shared/print-mode.test.ts || failures=$((failures+1))
        echo "== extensions/shared/print-mode-wiring.test.ts =="
        npx tsx extensions/shared/print-mode-wiring.test.ts || failures=$((failures+1))
        echo "== extensions/auto-sync.test.ts =="
        npx tsx extensions/auto-sync.test.ts || failures=$((failures+1))
        echo "== extensions/session-checks.test.ts =="
        npx tsx extensions/session-checks.test.ts || failures=$((failures+1))
        # #357 — sequence-enforcer: the gate-critical suite was the only one NOT
        # in CI (the never-passable checkpoint contract shipped untested, 08-12).
        # Zero-dep: the runtime pi-package import is inlined (isToolCallEventType).
        echo "== extensions/sequence-enforcer/sequence-enforcer.test.ts =="
        npx tsx extensions/sequence-enforcer/sequence-enforcer.test.ts || failures=$((failures+1))
        # #426 — review-enforcer: the merge-registry gate (gates EVERY merge in
        # this account). Needs the pi package (real runtime import): installed as
        # a devDep (package.json) from the public registry, pinned to the pi
        # runtime version (0.84.3) for CI parity.
        echo "== extensions/review-enforcer/index.test.ts =="
        (cd extensions/review-enforcer && npm ci --no-audit --no-fund --loglevel=error) && \
          NODE_ENV=test npx tsx extensions/review-enforcer/index.test.ts || failures=$((failures+1))
        if [ $failures -gt 0 ]; then
          echo "❌ $failures extension test file(s) failed"
          exit 1
        fi
        echo "✅ All extension tests passed"
    secrets: inherit

  script-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Node.js scripts
        run: |
          errors=0
          for f in scripts/*.{cjs,mjs,js} bin/*.js; do
            [ -f "$f" ] || continue
            node --check "$f" || errors=$((errors+1))
          done
          if [ $errors -gt 0 ]; then
            echo "❌ $errors script(s) failed validation"
            exit 1
          fi
          echo "✅ All scripts validated"
      - name: Validate bash scripts + run installer tests (#304)
        run: |
          errors=0
          for f in scripts/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || errors=$((errors+1))
          done
          bash scripts/install-launchd.test.sh || errors=$((errors+1))
          bash scripts/record-review.test.sh || errors=$((errors+1))
          if [ $errors -gt 0 ]; then
            echo "❌ $errors bash script(s)/test(s) failed validation"
            exit 1
          fi
          echo "✅ All bash scripts validated + installer tests passed"

  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill lint (hard gate — issue #237)
        run: |
          node scripts/check-skill-lint.mjs --skills-dir skills

  cost-config-guard:
    # #341 — post-merge re-check of the deepseek context clamp @400K on shipped
    # configs (models.json + models-store.json + settings.json contract).
    # Shipped-only: the live pass runs at sync.sh; catalog-store drift is
    # DETECTED (warn) not blocked — the 4h pi.dev refresh may legitimately
    # revert the store, and the weekly report + tripwire are the alert path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cost-config guard (shipped, --shipped-only)
        run: bash scripts/check-cost-config.sh --shipped-only

  python-ci:
    # #383 — post-merge run of the vendored parallel_work_check suite via the
    # reusable python-ci.yml (finally called, per the Task 5 intent). The
    # skip-empty guard (install-extras: '') skips the extras install; pytest
    # lands in the setup-python 3.12 toolcache. python-version MUST be '3.12'
    # to match test-command's `python3.12` — the runner's system python3.12
    # has neither pytest nor pytest-timeout (a 3.11/3.12 mismatch would fail
    # every post-merge run and auto-file false "main broken by merge" issues).
    uses: daniel-ospina/agent-infra/.github/workflows/python-ci.yml@main
    secrets: inherit
    with:
      python-version: '3.12'
      test-command: 'python3.12 -m pytest scripts/test_parallel_work_check.py -x --timeout=60 -q'
      lint-command: ''
      typecheck-command: ''
      install-extras: ''

  auto-file-on-failure:
    runs-on: ubuntu-latest
    needs: [extension-tests, script-validate, skill-lint, cost-config-guard, python-ci]
    if: failure()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `main broken by merge (${context.sha.slice(0,7)})`,
              body: `Post-merge CI failed on main at ${context.sha}.\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug'],
            });
