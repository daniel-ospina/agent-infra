name: CI on main
# Post-merge safety net (issue #86): catches "PR A + PR B together break main"
# that per-PR review cannot see. Runs after every push to main.
#
# Hard gates (fail on error): extension tests + script validation + skill lint —
# deterministic and green today. skill-lint is the post-merge re-check; the
# per-PR hard gate runs in ci.yml → node-ci.yml (issue #237).
#
# On failure, a GitHub issue is auto-filed. That filing is MAIN-ONLY: an
# `integration/**` push below runs this same matrix as a PRE-merge gate, and a
# red integration tree must NOT be reported as "main broken by merge" — it never
# reached main (agent-infra#3131).

on:
  push:
    # `integration/**` is the batch/integration train (agent-infra#3131): K PRs are
    # merged into one branch and THIS matrix runs ONCE on the composed tree, so
    # main only ever receives a tree that already passed. No `concurrency:` block
    # is added — a push-triggered workflow must not cancel (check-workflow-
    # concurrency.sh R2), and the train is single-writer by design.
    branches: [main, 'integration/**']

permissions:
  contents: read
  issues: write

jobs:
  extension-tests:
    # #387 — dogfood the reusable capability (was: inline failure accumulator).
    # Stack gates skipped: ci-main keeps richer inline copies (bash -n + installer
    # tests #304, --skills-dir skill-lint) whose coverage node-ci jobs lack — keep
    # them. (No job duplication in practice: agent-infra has no root tsconfig/eslint,
    # so node-ci typecheck/lint self-skip; the unit-test job is the only new surface.)
    uses: daniel-ospina/agent-infra/.github/workflows/node-ci.yml@main
    with:
      node-version: '22'
      script-validate: false
      skill-lint: false
      test-command: |
        # #3131 — this matrix now also runs on `integration/**` (#3139), and ONE
        # guard assertion is keyed to the checkout rather than to the change:
        # `extensions/main-worktree-guard/test.mjs` expects the sanctioned-recovery
        # script `git checkout main && git pull --ff-only` to be ALLOWED, which the
        # classifier can only grant when `main` is a verifiable checkout target
        # (`_recoveryCheckoutVerifiable` → a local `refs/heads/main`, or exactly one
        # remote whose fetch refspec maps onto an EXISTING tracking ref). A
        # single-ref checkout of a non-main branch leaves NEITHER, so the guard
        # correctly answers `block` and the assertion fails for a reason that has
        # nothing to do with the branch's content — measured on two runs: this
        # assertion GREEN in `main`'s unit-test log (run 41185164653), RED in
        # `integration/batch-20261031-16`'s (run 41190178021, job
        # `extension-tests / unit-test`), with `classify-git.mjs` byte-identical to
        # main.
        #   ⚠ The `unit-test` JOB was ALSO red on `main` while this was written, for
        # an UNRELATED reason (`test-sanctioned-identity.mjs`: stale
        # `sanctioned-scripts.pin.json` digests for `record-review.sh` /
        # `admin-merge.sh`, 14 passed / 6 failed on run 41185164653). `main` carries
        # the fix for that red — `#3140` re-cut the pin at `6423b5bc3` — and the
        # reason this fix matters is the GENERAL case, not that instance: two
        # independent causes reddening one job make an `integration/**` failure
        # unattributable, because one of the two is invisible to any baseline
        # comparison.
        #   Materialize the DWIM source rather than weaken the assertion: the test
        # then measures the guard, not the checkout depth, and every future
        # `integration/**` run stays judgeable. NOT `|| true` — a fetch that cannot
        # produce `origin/main` must fail the job loudly, because silently skipping
        # it would restore the false red it exists to remove. `--no-tags` mirrors
        # actions/checkout (which fetches without tags by default), so the non-main
        # run does not pull tags into a checkout that would otherwise have none.
        #   The `--git-dir` clause is NOT cosmetic: `scripts/check-pi-pin-lockstep.mjs`
        # EXECUTES this committed `test-command` inside a `mktemp -d` directory that is
        # not a repository, under `bash -e`. Unguarded, the fetch exits 128 there and
        # takes the whole step down. Measured on the UNGUARDED revision of this preamble
        # (`0bac887d9`): 115 passed / 9 failed, and 124 / 0 on that SAME commit with the
        # fetch skipped (`GITHUB_REF=refs/heads/main`) — same head, so the fetch is the
        # cause. With this guard, `node scripts/check-pi-pin-lockstep.mjs` is 124 / 0 at
        # EVERY value of `GITHUB_REF` (unset, main, refs/pull/N/merge, a feature branch),
        # because the harness's temp dir has no repo to fetch into.
        # Outside a repository there is no
        # tracking ref to create and nothing to judge; the guard's own assertion
        # answers `allow` there because `_recoveryCheckoutVerifiable` has no git dir to
        # consult. So: skip when there is no repo, and fail loudly when there is one and
        # the fetch cannot produce `origin/main`.
        if [ "${GITHUB_REF:-}" != "refs/heads/main" ] && git rev-parse --git-dir >/dev/null 2>&1; then
          git fetch --depth=1 --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
        fi
        failures=0
        # #2188 — a suite that CRASHES (an uncaught assertion) prints no aggregate
        # line at all, so `scripts/ci_exemption.py ids` yielded ZERO identities for
        # the run and `scripts/admin-merge.sh` answers that with a REFUSAL, not a
        # comparison. Measured 2026-10-20: main's ONLY red was one crashing file
        # (`extensions/shared/capture-gate.test.ts`), nothing could be certified
        # against it, and the tree stayed red.
        #   `mark` OPENS a suite and CLOSES the previous one: if `failures` grew
        # while the previous suite was marked, that suite failed — so the annotation
        # names the FILE. The identity is the file path alone: never a count, never
        # an observed value, never the assertion text (a rotating identity can never
        # match the baseline it is compared against, #3756).
        #   The `... || failures=$((failures+1))` call sites are left BYTE-IDENTICAL
        # on purpose: `scripts/check-pi-pin-lockstep.mjs` item 6a pins the pin-suite
        # invocation as an EXACT trimmed line, and rewriting every site would force a
        # re-pin (and weaken it) to buy nothing this counter delta does not already
        # give.
        failed_suites=()
        suite_label=""
        marked_at=0
        close_suite() {
          if [ "$failures" -gt "$marked_at" ]; then
            failed_suites+=("$suite_label")
            # ${suite_label}: strip CR/LF — GitHub workflow commands are LINE-DELIMITED
            # and the rail parses annotations per log line, so a newline in a label would
            # forge a SECOND, rail-accepted failure identity (a certification bought by a
            # file name). Labels are literals/glob output here; this is the guard (#2194 B2).
            echo "::error title=extension-tests::FAILED ${suite_label//[$'\n\r']/ }"
          fi
        }
        mark() {
          close_suite
          marked_at=$failures
          suite_label="$1"
          echo "== $1 =="
        }
        # #303 — pin-drift unit tests for the ci-ref check (bin/agent-infra.js surface).
        mark "scripts/ci-ref-check.test.mjs"
        node scripts/ci-ref-check.test.mjs || failures=$((failures+1))
        # #254 — frontmatter validator fixture-regression (post-merge, ci-main)
        mark "scripts/check-skill-lint.test.mjs"
        node scripts/check-skill-lint.test.mjs || failures=$((failures+1))
        # #666 — the pi-pin lockstep tripwires ((h) pins, (i) mirror stamps,
        # (j) the per-PR wiring) moved out of the suite above into their own
        # single-purpose suite; run it here too so extracting them does not drop
        # the post-merge half of #637's contract (ci.yml runs both per-PR).
        mark "scripts/check-pi-pin-lockstep.mjs"
        node scripts/check-pi-pin-lockstep.mjs || failures=$((failures+1))
        # #668 — commit-msg mangle heuristic (runs the hook directly; husky
        # is NOT installed in CI, #672).
        mark "scripts/commit-msg-check.test.sh"
        bash scripts/commit-msg-check.test.sh || failures=$((failures+1))
        # #1760 — the version-stamp drift check's suite (the keystone of tracker #1759). Named
        # explicitly like its neighbours above: this leg has no `scripts/*.test.mjs` glob, so an
        # unwired suite is never collected post-merge (the #1719 shape — versioned but wired to
        # nothing). The suite, not the checker: it builds its own git fixtures, so it does not read
        # the runner's surface set.
        mark "scripts/check-version-stamp.test.mjs"
        node --test scripts/check-version-stamp.test.mjs || failures=$((failures+1))
        # Glob-collected: every extensions/*/test*.mjs suite, including #744's
        # main-worktree-guard/test-module-load.mjs (the index.ts module-LOAD
        # regression pin) — no explicit line for it, that would double-run it.
        # ⚠️ This leg is POST-MERGE only (on: push → main); the per-PR run of
        # the #744 suite is wired in ci.yml — the per-PR workflow that runs the
        # test suites. (This comment used to add "pipeline-compliance.yml is also
        # PR-triggered, but runs no test suite" — stale since #991, which wired
        # the pipeline-compliance fixture suite in, and since #1027, which added
        # tests/materialize-agents/run.sh to the same required job.)
        for t in extensions/*/test*.mjs; do
          [ -f "$t" ] || continue
          mark "$t"
          node "$t" || failures=$((failures+1))
        done
        # shared/print-mode tests: the isPrintMode helper gates 17 sites (#228).
        # print-mode.test.ts covers helper logic; print-mode-wiring.test.ts
        # enforces the 0-raw-reads acceptance repo-wide; auto-sync.test.ts
        # exercises the FLAT-extension ./shared/ import path (the bug class
        # that shipped 2 files during this refactor's development).
        mark "extensions/shared/print-mode.test.ts"
        npx tsx extensions/shared/print-mode.test.ts || failures=$((failures+1))
        mark "extensions/shared/print-mode-wiring.test.ts"
        npx tsx extensions/shared/print-mode-wiring.test.ts || failures=$((failures+1))
        # #382 — the remaining shared/*.test.ts suites (audit-log, process-sweep,
        # retry, tree-kill) were unwired: the extensions/*/test*.mjs glob above
        # misses .ts files. Loop the rest, skipping the explicitly-listed ones
        # (a future shared suite is picked up automatically). Zero-dep tsx route.
        # #783 — dispatch-record.test.ts MUST be skipped here: it imports
        # ../builtin-tools/index.js (#29), which needs typebox from the
        # builtin-tools npm ci BELOW this loop. Running it here fails
        # ERR_MODULE_NOT_FOUND on a fresh checkout. Run explicitly after the ci.
        for t in extensions/shared/*.test.ts; do
          [ -f "$t" ] || continue  # no-match guard (glob loops elsewhere in this file)
          case "$t" in
            extensions/shared/print-mode.test.ts|extensions/shared/print-mode-wiring.test.ts) continue ;;
            extensions/shared/dispatch-record.test.ts) continue ;;
            extensions/shared/kill-switch.test.ts) continue ;;  # #1419 — run explicitly below
          esac
          mark "$t"
          npx tsx "$t" || failures=$((failures+1))
        done
        mark "extensions/auto-sync.test.ts"
        npx tsx extensions/auto-sync.test.ts || failures=$((failures+1))
        mark "extensions/session-checks.test.ts"
        npx tsx extensions/session-checks.test.ts || failures=$((failures+1))
        # #2932 — task-signal-forensics: when 17 dispatched children were SIGTERM'd
        # inside 3 s, nothing on the box recorded a sender and three worktrees lost
        # 16 uncommitted files. This suite spawns a REAL lane, sends it a REAL
        # SIGTERM, and asserts both arms (the sender is named; the work is pinned by
        # a checkpoint ref) plus the non-behaviour-change control (still exits by
        # SIGTERM/143). Zero-dep: node stdlib + git only; needs Node >= 22.18 for
        # `--experimental-strip-types`, which the fixture uses to import the`.ts`
        # source from a plain `.mjs` bootstrap. Its mutation driver is a bash shard
        # (`tests/lane-signal-forensics/run.sh`, discovered by run-bash-shards.sh).
        mark "extensions/task-signal-forensics.test.ts"
        npx tsx extensions/task-signal-forensics.test.ts || failures=$((failures+1))
        # #611 — reflect-hook capture attribution: first reflect-hook tests.
        # Zero-dep: stdlib-only; uses dynamic require for env ordering.
        mark "extensions/reflect-hook.test.ts"
        npx tsx extensions/reflect-hook.test.ts || failures=$((failures+1))
        # #1215 — compaction-watchdog: the context-clamp death (#1214) must never
        # be silent. Zero-dep (pi import is TYPE-only, node stdlib otherwise);
        # drives all four sinks through the NODE_ENV=test hook seam, so it never
        # touches the real ~/.pi. Negative pins: aborted compaction, legitimate
        # `length` stop, max_tokens > 1 and missing max_tokens all record nothing.
        mark "extensions/compaction-watchdog.test.ts"
        npx tsx extensions/compaction-watchdog.test.ts || failures=$((failures+1))
        # #1214 (b) — clamp-output-floor: the upgrade-proof half of the same fix.
        # Wired here deliberately: the whole point of this extension is that it is
        # the layer still standing AFTER a pi upgrade reverts scripts/pi-patches.
        # A guard whose own test CI never runs is a guard nobody has checked.
        # Zero-dep (no pi import at all); negative pins: a floor-or-above ceiling,
        # a missing/non-numeric field, and an already-healthy payload must all be
        # left BYTE-IDENTICAL — the guard must never rewrite a good request.
        mark "extensions/clamp-output-floor.test.ts"
        npx tsx extensions/clamp-output-floor.test.ts || failures=$((failures+1))
        # #1138 — cmux-session: the repo copy is a bootstrap SNAPSHOT of a file
        # cmux upgrades IN PLACE on the farm, so it can silently fall behind
        # (measured: main carried v2 at 55,408 B while the farm ran v4 at
        # 74,220 B, and that delta existed in no ref). The marker pin fails on any
        # snapshot that is not the version EXPECTED_MARKER names; without this
        # line the suite runs nowhere and the drift is silent again — the inert-
        # gate shape its sibling version-stamp step in ci.yml's `verify` job names.
        # Zero-dep (pi import is TYPE-only, erased by tsx); mirrors the ci.yml step.
        mark "extensions/cmux-session.test.ts"
        npx tsx extensions/cmux-session.test.ts || failures=$((failures+1))
        # #5109 — secret-echo-guard: the transcript-leak control. Post-merge
        # backstop for the per-PR step in ci.yml, same split as clamp above.
        # Zero-dep (pi import is TYPE-only, node stdlib otherwise); negative pins
        # assert ordinary output is returned BY REFERENCE (no patch) and records
        # nothing, a sub-floor value is not redacted, and no sink carries a value.
        mark "extensions/secret-echo-guard.test.ts"
        npx tsx extensions/secret-echo-guard.test.ts || failures=$((failures+1))
        # #723 — loop-enforcer TIER_CONFIG vs the canonical Review Cycles table
        # in skills/proportional-gates/SKILL.md: the runtime-vs-governance
        # drift class (complex.maxCycles sat at 2× the canonical bound with no
        # gate reading it). Mirrors the per-PR verify-job step in ci.yml.
        mark "extensions/loop-enforcer/tier-config-parity.test.ts"
        npx tsx extensions/loop-enforcer/tier-config-parity.test.ts || failures=$((failures+1))
        # #847 — the OTHER four loop-enforcer suites were wired nowhere: the L3
        # stall predicates (`termination.test.ts`) could not have caught the
        # inverted-predicate regression in CI at all. Same shape as the shared/
        # glob above; `tier-config-parity.test.ts` is skipped here because it is
        # explicitly listed (and per-PR wired) just above.
        for t in extensions/loop-enforcer/*.test.ts; do
          [ -f "$t" ] || continue
          case "$t" in
            extensions/loop-enforcer/tier-config-parity.test.ts) continue ;;
          esac
          mark "$t"
          npx tsx "$t" || failures=$((failures+1))
        done
        # #357 — sequence-enforcer: the gate-critical suite was the only one NOT
        # in CI (the never-passable checkpoint contract shipped untested, 08-12).
        # Zero-dep: the one runtime value it needed from pi
        # (isToolCallEventType) is imported from extensions/shared/tool-call-event.ts,
        # not inlined here (#1330).
        mark "extensions/sequence-enforcer/sequence-enforcer.test.ts"
        npx tsx extensions/sequence-enforcer/sequence-enforcer.test.ts || failures=$((failures+1))
        # #1419 — the deadlock escape. `KILL_SWITCH_FILE` was a FREE identifier in
        # loop-enforcer (5 uses, 0 definitions/imports), so every write threw
        # ReferenceError into a swallowed catch and the documented escape was inert
        # while still advertising a guarantee. The agent escape is now session-local
        # and the machine-global switch stays the human's, so the suite covers the
        # no-active-loop path, the single-home invariant, the call ORDER inside
        # `stop`, and — because pi's loader gives every extension its own module
        # graph — that the escape CHANNEL is process-global rather than module-local
        # (the first version of this fix shipped the module-local bug).
        mark "extensions/shared/kill-switch.test.ts"
        npx tsx extensions/shared/kill-switch.test.ts || failures=$((failures+1))
        # #1321/#1322 — skill-enforcer: manifest resolution under the deployed
        # symlink layout (the `dirname(__filename)` farm bug #1321), a repeated
        # manifest line clobbering a skill's other rules, and layout-independent
        # read identity (#1322). Zero-dep; spawns temp farms through `npx tsx`
        # and through real jiti where resolvable. Mirrors the ci.yml verify step.
        mark "extensions/skill-enforcer.test.ts"
        npx tsx extensions/skill-enforcer.test.ts || failures=$((failures+1))
        # #426 — review-enforcer: the merge-registry gate (gates EVERY merge in
        # this account). Needs the pi package (real runtime import): installed as
        # a devDep (package.json) from the public registry, pinned to the pi
        # pi runtime version (0.85.1) for CI parity.
        mark "extensions/review-enforcer/index.test.ts"
        (cd extensions/review-enforcer && npm ci --no-audit --no-fund --loglevel=error) && \
          NODE_ENV=test npx tsx extensions/review-enforcer/index.test.ts || failures=$((failures+1))
        # #2287/#2148 — a SPAWNED reviewer process satisfies the ≥1-dispatch floor (a
        # record-review.sh verdict bound to the pushed head), and nothing else does: no
        # record / an older head / a foreign repo each still refuse. Same npm ci as above.
        mark "extensions/review-enforcer/index.spawn-evidence.test.ts"
        NODE_ENV=test npx tsx extensions/review-enforcer/index.spawn-evidence.test.ts || failures=$((failures+1))
        # #379 — verification-gate: the commit-gate suite (unit + e2e)
        # was unwired. Same route as review-enforcer above (real runtime pi
        # import — isToolCallEventType): pi devDep pinned 0.85.1, npm ci once, run
        # both files. index.e2e.test.ts redirects HOME to a temp dir (hermetic).
        mark "extensions/verification-gate/index.test.ts"
        (cd extensions/verification-gate && npm ci --no-audit --no-fund --loglevel=error) && \
          npx tsx extensions/verification-gate/index.test.ts || failures=$((failures+1))
        # #1330 — the SDK-bearing half of the shared tool-call predicate pin: the
        # repo's ONE copy (extensions/shared/tool-call-event.ts) must agree with the
        # REAL `isToolCallEventType` export. Runs HERE, off the `npm ci` above, because
        # it needs the SDK — which is also why the zero-dep `verify` job cannot run it.
        # Deliberately after that install rather than early in this accumulator: if the
        # install fails, this line fails loudly too instead of reporting a pass.
        # The zero-dep half (extensions/shared/tool-call-event.test.ts) is auto-collected
        # by the `extensions/shared/*.test.ts` glob far above — no line for it here.
        mark "extensions/verification-gate/tool-call-event-parity.test.ts"
        npx tsx extensions/verification-gate/tool-call-event-parity.test.ts || failures=$((failures+1))
        mark "extensions/verification-gate/index.e2e.test.ts"
        npx tsx extensions/verification-gate/index.e2e.test.ts || failures=$((failures+1))
        # #1460/#540 — the LANE-SATISFIABLE suite: the three refusals a `pi -p` lane could
        # not clear (md5-digest "mismatched", digest-free re-verify, and the in-batch chain's
        # split form). Runs off the same npm ci as its siblings; hermetic (HOME → temp dir).
        mark "extensions/verification-gate/index.lane-satisfiable.test.ts"
        npx tsx extensions/verification-gate/index.lane-satisfiable.test.ts || failures=$((failures+1))
        # #10219 — the VERDICT-LINE suite: a verifier's rendered verdict (`Result: PASS`, `> PASS`,
        # `[16:42] PASS`) must be readable in `pi -p` / task-child mode, where the interactive
        # #5724 fail-open cannot mask a parser gap; plus the FAIL mirror and the tested-line
        # diagnostic. Runs off the same `npm ci` as its siblings; hermetic (HOME → temp dir).
        mark "extensions/verification-gate/index.verdict-line.test.ts"
        npx tsx extensions/verification-gate/index.verdict-line.test.ts || failures=$((failures+1))
        # #755 — the merge-scope subtraction suite. SDK-FREE by construction
        # (index.js is a TYPE-only import), so it runs off the npm ci above with
        # no extra dependency.
        mark "extensions/verification-gate/subtract-scope.test.ts"
        npx tsx extensions/verification-gate/subtract-scope.test.ts || failures=$((failures+1))
        # #5550/#1491 — the push-scope PROOF (D1–D3 + F1–F14). It was wired into
        # NO lane while its three siblings ran, so a previously-unrun suite could
        # rot unobserved; this step closes that gap and runs beside its siblings.
        # NOTE this lane is trigger `push: [main]` (post-merge, like the unit/e2e
        # suites above): a regression is reported on main AFTER merge, not before.
        # A PR-gating leg is the follow-up (the suite value-imports ./index.js,
        # which imports the pi SDK, so it needs a scoped `npm ci` that ci.yml's
        # verify job deliberately avoids — the same constraint as its siblings).
        mark "extensions/verification-gate/index.5550.test.ts"
        npx tsx extensions/verification-gate/index.5550.test.ts || failures=$((failures+1))
        # #476 — provider-exhaustion failover suites (the shared/provider-failover*
        # suites are auto-picked by the shared glob above; the consumer-side
        # suites live under builtin-tools/ + the extension root). The parity suite
        # spawns python3 (ubuntu runners ship it).
        mark "extensions/provider-exhaustion.test.ts"
        npx tsx extensions/provider-exhaustion.test.ts || failures=$((failures+1))
        # #533 — builtin-tools: the three suites below import index.ts, which
        # imports typebox (real runtime dep declared in package.json
        # dependencies): npm ci once (same route as review-enforcer/verification-
        # gate above), then run all three — the install persists in the step and
        # Node resolves node_modules up-tree from the importing file.
        mark "extensions/builtin-tools/builtin-tools.test.ts"
        (cd extensions/builtin-tools && npm ci --no-audit --no-fund --loglevel=error) && \
          npx tsx extensions/builtin-tools/builtin-tools.test.ts || failures=$((failures+1))
        mark "extensions/builtin-tools/provider-failover.integration.test.ts"
        npx tsx extensions/builtin-tools/provider-failover.integration.test.ts || failures=$((failures+1))
        mark "extensions/builtin-tools/cut-resume.integration.test.ts"
        npx tsx extensions/builtin-tools/cut-resume.integration.test.ts || failures=$((failures+1))
        # #783 — the composer consolidation: cap / cut / heartbeat / backstop
        # all resolve through composeAbnormalExit, proven against a real cap
        # payload + the census instrument. Runs after the npm ci above.
        mark "extensions/builtin-tools/task-cap-handoff.integration.test.ts"
        npx tsx extensions/builtin-tools/task-cap-handoff.integration.test.ts || failures=$((failures+1))
        # #783 — dispatch-record.test.ts lives in extensions/shared but is NOT
        # zero-dep: it imports ../builtin-tools/index.ts (typebox). It is skipped
        # by the shared glob above (which runs before this npm ci) and run HERE,
        # after the install — same treatment as the builtin-tools suites.
        mark "extensions/shared/dispatch-record.test.ts"
        npx tsx extensions/shared/dispatch-record.test.ts || failures=$((failures+1))
        # provider-failover*.test.ts under extensions/shared are auto-picked by
        # the shared glob above (incl. the python3-spawning parity suite).
        # #553/#573/#574 — subagent suites: the two builtin-tools suites spawn a
        # real `pi -p --no-session` child via getPiInvocation (bare `pi` on
        # PATH); timeout-integration AND cache-integration run hermetic via a
        # PATH-shadow fake pi (#573 / #574).
        # Deps: extensions/subagent imports FOUR @earendil-works packages
        # (pi-coding-agent/pi-ai/pi-agent-core/pi-tui — the runtime import
        # surface needs the full tree) — npm ci once in extensions/subagent
        # (also brings the dep tree) and add its node_modules/.bin to PATH for
        # the two real-pi suites' child spawns.
        # Keys: hermetic by design — the job env has NO provider keys; the suites
        # self-skip the key-dependent startup/LLM assertions (their guards check
        # DEEPSEEK_API_KEY). #573/#574: timeout-integration + cache-integration
        # ARE wired — they run hermetic via a PATH-shadowing fake `pi` shell stub
        # created in each test's own setup (timeout: sleep 120 & … wait;
        # cache: sleep 120), so the 5s-timeout assertions run without provider
        # keys or billed LLM calls (no real pi binary needed).
        mark "extensions/subagent (npm ci)"
        (cd extensions/subagent && npm ci --no-audit --no-fund --loglevel=error) || failures=$((failures+1))
        mark "extensions/subagent/timeout-integration.test.ts"
        npx tsx extensions/subagent/timeout-integration.test.ts || failures=$((failures+1))
        mark "extensions/subagent/cache-integration.test.ts"
        npx tsx extensions/subagent/cache-integration.test.ts || failures=$((failures+1))
        # #1500 Leg B — the termination PROOF. `builtin-tools.test.ts` can only
        # show that the `tool_call` guard writes a finite positive number into
        # `input.timeout`; it cannot show that pi ACTS on it. This suite drives
        # the REAL `createBashTool` (same pinned-pi devDep route as its siblings
        # above) and proves the command is killed AT the bound with a recoverable
        # message, that a call inside the bound is untouched, and — the control
        # arm — that an ABSENT timeout really does have no bound, which is the
        # defect itself. It must run AFTER the `npm ci` above, and it needs an
        # explicit line here because this leg is a hard-coded list, not a glob:
        # no glob reaches `extensions/subagent/*.test.ts`.
        mark "extensions/subagent/tool-timeout-bound.test.ts"
        npx tsx extensions/subagent/tool-timeout-bound.test.ts || failures=$((failures+1))
        # #783 Task 7.3 — subagent parity pin: the ext keeps its OWN timeout /
        # stall semantics and was NOT dragged by the builtin-tools task-constant
        # split. Zero-dep source pin (node:* + readFileSync only), wired here
        # alongside the rest of the subagent-extension suites. This is the
        # post-merge backstop; note its sibling zero-dep pin
        # (extensions/shared/default-coverage.test.ts) ALSO runs per-PR in
        # ci.yml's verify job, so the earlier "ci.yml runs no npm ci" rationale
        # for keeping THIS one post-merge-only was false — it could run there
        # too, but this job is where the subagent surface is covered.
        mark "extensions/subagent/subagent-parity.test.ts"
        npx tsx extensions/subagent/subagent-parity.test.ts || failures=$((failures+1))
        mark "extensions/builtin-tools/subagent-integration.test.ts"
        PATH="$PWD/extensions/subagent/node_modules/.bin:$PATH" \
          npx tsx extensions/builtin-tools/subagent-integration.test.ts || failures=$((failures+1))
        mark "extensions/builtin-tools/subagent-e2e-smoke.test.ts"
        PATH="$PWD/extensions/subagent/node_modules/.bin:$PATH" \
          npx tsx extensions/builtin-tools/subagent-e2e-smoke.test.ts || failures=$((failures+1))
        # #802 — mcp-client suites were never wired into CI (the extension had
        # node_modules deps but no job). eager-retry.test.ts is the #802
        # regression guard: eager connect must retry a cold/stalling server
        # once and name `mcp_load <server>` when it still fails. The suites
        # import @modelcontextprotocol/sdk + typebox (real runtime deps), so
        # npm ci once (same route as builtin-tools/subagent above), then run
        # from the repo root — resolution.test.ts reads templates/ via cwd.
        mark "extensions/mcp-client (npm ci)"
        (cd extensions/mcp-client && npm ci --no-audit --no-fund --loglevel=error) || failures=$((failures+1))
        for t in resolution.test.ts lifecycle.test.ts oauth.test.ts eager-retry.test.ts oauth-refresh.integration.test.ts; do
          mark "extensions/mcp-client/$t"
          npx tsx "extensions/mcp-client/$t" || failures=$((failures+1))
        done
        mark "extensions/mcp-client/mcp-load.integration.test.ts"
        npx tsx extensions/mcp-client/mcp-load.integration.test.ts || failures=$((failures+1))

        # CLOSE the LAST suite: nothing after it calls `mark`, so a failure in the
        # final suite is still announced (its annotation is what the rail parses).
        # ⚠️ The aggregate block below is a BYTE-EXACT mutation ANCHOR for the pin
        # suite's negative controls (scripts/check-pi-pin-lockstep.mjs item 6/6b) —
        # do not edit inside it; put anything new ABOVE it.
        close_suite
        # Name the failing files for the operator reading the job too — the
        # annotations above are what the RAIL parses, this list is what a human
        # scans. Kept ABOVE the aggregate block: that block is byte-exact.
        if [ "${#failed_suites[@]}" -gt 0 ]; then
          for f in "${failed_suites[@]}"; do echo "   FAILED: $f"; done
        fi
        if [ $failures -gt 0 ]; then
          echo "❌ $failures extension test file(s) failed"
          exit 1
        fi
        echo "✅ All extension tests passed"
    secrets: inherit

  script-validate:
    runs-on: ubuntu-latest
    # #2055: the main lane runs the SAME sweep as ci.yml's `bash-suites` — this job calls the one
    # runner below, UNSHARDED (main runs once per merge, so the queue a hang would starve is
    # smaller than the PR lane's 80 open PRs), and it also runs the parity guard plus its mutation
    # self-test.
    #
    # ⛔ THE 38m41s SELF-TEST FIGURE THIS COMMENT USED TO CARRY IS STALE, and the bound that was
    # sized from it (70 min on a step that now runs in ~6-9 s) was protecting nothing. That
    # measurement is PR #2412's (job 120365087427, 2026-10-23T10:25Z) and predates #2529
    # (`00814821`, 16:09Z same day), which stopped the self-test's fixture re-running the real
    # shard list. MEASURED AFTER #2529 (2026-10-24, this job, 8 successful main runs pulled from the
    # Actions API): step 6, the self-test, **6-9 s**; step 7, the shards, **46m38s-54m32s**. The PR
    # lane's equivalent step, 17 runs sampled: 6-12 s with one 17 s outlier. What remains expensive
    # here is the SHARDS step — that is what the 110 min bound below is sized for, and what sharding
    # main (the separate change named below) would cut.
    #
    # ⛔ A bound BELOW the measured run is worse than no bound: it false-blocks main on every merge
    # cycle, and a red that is not a defect is how a gate loses its authority. This bound is sized
    # only to catch a HANG (which, before this line, could hold a runner indefinitely — #2055);
    # the real fix for the main lane's duration is sharding it like the PR lane, which is a
    # separate change (it needs its own parity-guard review: `check-ci-lane-parity` asserts THIS
    # job makes the bare call).
    #
    # ⛔ THE JOB BOUND IS A PURE BACKSTOP; THE BLOCKING BOUNDS ARE ON THE STEPS BELOW. A job that
    # trips `jobs.<id>.timeout-minutes` is reported `cancelled` — the service cancels the job, the
    # job-cancellation callback sets `jobContext.Result = TaskResult.Canceled`
    # (`StepsRunner.cs:149-155`, the `Canceled` arm at :154), and a step still running then takes
    # `TaskResult.Canceled` (`StepsRunner.cs:331-336`). `JobRunner.cs` has NO timeout handling — its
    # `TaskResult.Canceled` at :198 is the *initialize* cancel path, not this one.
    # `cancelled` is NON-RED to this repo's rail (`scripts/admin-merge.sh` NON_RED_CONC) — so a
    # job-only bound on MAIN would let a hang certify as a non-red and the tree's only unsharded
    # sweep would silently stop gating. A STEP bound is `TaskResult.Failed` (`StepsRunner.cs:324-329`)
    # = `failure` = red.
    #
    # ⛔ AND THE JOB BOUND SITS ABOVE THE SUM OF THE STEP BOUNDS, so it can never pre-empt a step:
    # 10 (checkout) + 10 (node) + 10 (node --check) + 5 (parity) + 15 (self-test) + 110 (shards) =
    # 160 < 230. Below the sum, the non-red job-level `cancelled` could win instead of the red
    # step-level `failure` — the whole defect this block exists to close, re-entering through the
    # backstop. 230 also stays ~2.1x the 110 min shard step it backstops, so it cannot
    # false-block.
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
      # Node is pinned because the shards below include `tests/search-cost/run.sh` (Node >= 22.13 —
      # see ci.yml's `search-cost` job). ci.yml's `bash-suites` carries the identical pin, so the two
      # lanes run the same list under the same runtime.
      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: '22'
      - name: Validate Node.js scripts
        timeout-minutes: 10
        run: |
          errors=0
          for f in scripts/*.{cjs,mjs,js} bin/*.js; do
            [ -f "$f" ] || continue
            node --check "$f" || errors=$((errors+1))
          done
          if [ $errors -gt 0 ]; then
            echo "❌ $errors script(s) failed validation"
            exit 1
          fi
          echo "✅ All scripts validated"
      - name: Lane-parity guard — both lanes must call the one shard runner (#1369)
        # Bare call: its exit code IS the step's. `runner || errors=$((errors+1))` was the old
        # form and is REFUSED by scripts/check-ci-lane-parity.sh — the guard cannot see whether
        # an accumulator is ever read, so accepting it accepts "count the failure and exit 0".
        timeout-minutes: 5
        run: bash scripts/check-ci-lane-parity.sh
      - name: Lane-parity guard self-test — mutations, not just "it runs" (#1369)
        # 6-9 s measured on this job since #2529 (8 successful main runs, 2026-10-24; 6-12 s with
        # one 17 s outlier on the PR lane, 17 runs). 15 min ≈ 100x the 9 s worst observed here; the
        # old 70 min was sized from a measurement taken before #2529 and could not fail fast.
        timeout-minutes: 15
        run: bash tests/ci-lane-parity/run.sh
      - name: Bash shards — the ONE list both lanes run (#1369)
        # #1369 — the ONE list of bash shards is scripts/run-bash-shards.sh, and BOTH lanes
        # call it: a shard added there is in both lanes by construction, so a lane split
        # cannot recur by drift. The runner's runtime self-checks (executed == listed, a sweep
        # sentinel, a failure-recording sentinel) fail the step if its arms are disabled.
        # Bare call, one step: a shard failure must fail the RUN, not just a counter.
        # 46m38s-54m32s measured on this job (8 successful main runs, 2026-10-24) for the whole
        # unsharded list; 110 min is ~2.0x the top of that range. (The 73m37s figure this comment
        # used to carry is PR #2412's,
        # before the shard work that followed.) STEP-level for the reason in this job's header: a
        # job-level trip is `cancelled` and non-red to the rail, a step-level trip is `failure`
        # and red.
        timeout-minutes: 110
        run: bash scripts/run-bash-shards.sh

  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill lint (hard gate — issue #237)
        run: |
          node scripts/check-skill-lint.mjs --skills-dir skills

  cost-config-guard:
    # #341 — post-merge re-check of the deepseek context clamp @300K on shipped
    # configs (models.json + models-store.json + settings.json contract; #476
    # guard-sync shipped the 400K→300K clamp + keepRecentTokens 12000).
    # Shipped-only: the live pass runs at sync.sh; catalog-store drift is
    # DETECTED (warn) not blocked — the 4h pi.dev refresh may legitimately
    # revert the store, and the weekly report + tripwire are the alert path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cost-config guard (shipped, --shipped-only)
        run: bash scripts/check-cost-config.sh --shipped-only
      - name: Cost-config fixture suite (#341 scenarios 0-14; green same-merge)
        run: bash tests/cost-config/run.sh

  sigpipe-grep-guard:
    # #841/#861 — post-merge re-check of the builtin-writer SIGPIPE
    # false-negative guard. `printf`/`echo` piped into a quiet `grep` under
    # `pipefail` can report "not found" for a present match (SIGPIPE once grep
    # exits early), silently turning a guard into a pass. This is the MAIN-line
    # red signal: a merge that reintroduces the idiom, or that leaves a stale
    # exception, fails here even if its PR check was bypassed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SIGPIPE false-negative guard (the scan set must be clean)
        run: bash scripts/check-no-sigpipe-grep.sh
      - name: SIGPIPE guard suite (hermetic, zero network)
        run: bash tests/sigpipe-grep/run.sh

  bash32-parse-guard:
    # #2930 — post-merge re-check of the bash-3.2 parse gate. The runtime platform of this harness is
    # macOS, whose `/bin/bash` is 3.2.57 (bash 4+ is GPLv3, so Apple never shipped it), while every CI
    # runner is Linux/bash 5 — so a construct 3.2 cannot parse ships GREEN and only breaks at the
    # destination. That is what happened: `merge-reminder.test.sh` failed `bash -n` at line 2629
    # under 3.2, `install.sh`'s `bash -n` sweep refused, and NO Mac could install the harness. This is
    # the MAIN-line red signal: a merge that reintroduces the shape fails here even if its PR check
    # was bypassed. Family: #2248 (3.2 executes a here-doc body's words inside a `$( )`).
    #
    # The gate runs the real 3.2 parser in the digest-pinned `bash:3.2` image, and is FAIL-CLOSED: no
    # docker, no interpreter, or an interpreter that is not 3.x exits 2 and names the cause.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
      - name: Every shipped script parses under bash 3.2 (#2930)
        timeout-minutes: 5
        run: bash scripts/check-bash32-parse.sh
      - name: bash-3.2 parse gate suite (fixtures, fail-closed arms, mutations)
        timeout-minutes: 5
        run: bash tests/bash32-parse/run.sh

  pi-config-extensions-guard:
    # #498/#502 — post-merge re-check of the pi-config extension-farm parity gate
    # (issue #95 invariant): every TRACKED extensions/ top-level entry except
    # *.test.ts, and except dot-named repo furniture such as .gitkeep, must be
    # farm-wired into pi-bootstrap/pi-config/extensions AND
    # listed in manifest.json files.extensions.entries (consumer ship-list —
    # #502 closes the manifest↔tree drift class; #498 fixed one stale row).
    # #2425: "tracked" = git lists it under extensions/; an untracked, ignored
    # node_modules-only directory is not an extension and cannot false-block.
    # Catches the "PR merged without wiring" drift class that per-PR CI cannot
    # see when the farm edit and the extension land on different branches.
    # #3002 — the machine-local farm checks read a farm NAMED by the job, never
    # the runner box's own ~/.pi farm (a host-dependent post-merge verdict is
    # the same defect as a host-dependent per-PR one).
    env:
      PI_EXTENSIONS_DIR: ${{ github.workspace }}/pi-bootstrap/pi-config/extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extension-farm parity gate (symlink farm + manifest.json into extensions/)
        run: bash scripts/check-pi-config-extensions.sh

  python-ci:
    # #383 — post-merge run of the vendored parallel_work_check suite via the
    # reusable python-ci.yml (finally called, per the Task 5 intent). The
    # skip-empty guard (install-extras: '') skips the extras install; pytest
    # lands in the setup-python 3.12 toolcache. python-version MUST be '3.12'
    # to match test-command's `python3.12` — the runner's system python3.12
    # has neither pytest nor pytest-timeout (a 3.11/3.12 mismatch would fail
    # every post-merge run and auto-file false "main broken by merge" issues).
    uses: daniel-ospina/agent-infra/.github/workflows/python-ci.yml@main
    secrets: inherit
    with:
      python-version: '3.12'
      # #3761 — the CI-exemption decision suite rides the SAME single pytest
      # invocation (concrete .py targets, never a `tests/` dir-suite → no #403
      # finding). Post-merge, a RED here reaches auto-file-on-failure through
      # this job's `needs:` entry, same as the vendored suite above it. Test
      # half of tortoise#3761; the canonical module never leaves this repo.
      # #1552 — same reasoning, same list: test_objective.py + test_turn_classify_state.py
      # were laptop-only until #1552 and are named here so the repo RUNS them.
      # #2139 — test_beta_progress.py rides the same list (byte-identical to the PR lane's
      # `test` job): the DELIVERY line's REST second source was live on four boxes and in no
      # repo file, so nothing in CI exercised the fallback it now ships.
      # #1187 — test_cmux_payload.py rides it too, for the same reason (the sender's
      # payload-integrity checker was about to ship with no suite running it).
      test-command: 'python3.12 -m pytest scripts/test_parallel_work_check.py tests/test_ci_exemption.py tests/test_ci_exemption_producer.py scripts/test_lane_status.py scripts/test_lane_actions.py scripts/test_lane_watchdog.py scripts/test_admin_merge_head.py scripts/test_objective.py scripts/test_cmux_payload.py scripts/test_merge_queue.py scripts/test_turn_classify_state.py scripts/test_pr_doctor.py scripts/test_ask_owner.py scripts/test_dispatch_wiring.py scripts/test_pr_loop.py tests/test_pytest_root_cut.py scripts/test_beta_progress.py scripts/test_bounce_state.py -x --timeout=60 -q'
      lint-command: ''
      typecheck-command: ''
      install-extras: ''

  auto-file-on-failure:
    runs-on: ubuntu-latest
    needs: [extension-tests, script-validate, skill-lint, cost-config-guard, pi-config-extensions-guard, sigpipe-grep-guard, bash32-parse-guard, python-ci]
    if: failure() && github.ref == 'refs/heads/main'
    # ⛔ BOTH CLAUSES ARE LOAD-BEARING (#3131), in DIFFERENT directions.
    #   `failure()` must stay: the steps derive the failing set from `needs`, and the
    #   filer files EVEN WHEN THAT SET IS EMPTY (bare title `main broken by merge`,
    #   `Failing jobs: unknown`) — there is no `failed.length === 0` early return. So a
    #   ref condition ALONE would run this job on every push to `main` and file a FALSE
    #   "main broken by merge" issue on every GREEN one.
    #   The ref clause is what keeps an `integration/**` matrix failure from being filed
    #   as "main broken by merge": that tree never reached main, and a false issue there
    #   is precisely the noise that hides the real ones.
    # RESIDUAL (round-2 review): paginate -> find -> create is check-then-act, so two
    # concurrent post-merge runs can both create (runs 34534428397 / 34534452089 failed 17s
    # apart on 2026-09-10 and filed #710 / #711). A job-level `concurrency:` group was added
    # here and then REMOVED: with `cancel-in-progress: false` GitHub keeps at most one running
    # AND one pending job, so a third queued filer EVICTS the pending one and that filing
    # silently never happens. Dropping a filing is worse than an extra duplicate — this
    # change's own rule is "a duplicate beats silence" — so the race is left as a bounded
    # residual rather than traded for a new fail-open. It is strictly rarer than the pre-fix
    # behaviour, which created a duplicate on every failure.
    steps:
      - uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            // #903 / #937 — ONE issue per FAILING JOB SET, not one per commit.
            //
            // The title used to carry the SHA (`main broken by merge (cc288d5)`), which is
            // unique by construction, so it could never match an open issue and every failure
            // minted a duplicate — 35 since 08-13 as of 2026-09-13 (#850 and #837 were filed
            // for this defect and have since been CLOSED as stale duplicates; #975 and #976
            // were two OPEN duplicates minted 5s apart by the race this change also guards).
            //
            // A bare constant title would dedup but OVER-collapse: the filer never recorded
            // which job failed, so two unrelated breakages would share one issue, and closing
            // it for one would silently mark the other resolved. Keying on the failing job set
            // separates them and preserves run -> failing-job traceability.
            //
            // Provenance: #339 (08-25) identified this defect and prescribed this remedy —
            // docs/plans/2026-08-25-339-merge-reliability.md, Option 2: "dedupe: if an OPEN
            // issue already exists with the same signature (workflow + job + assertion),
            // comment the new run on it instead of filing a new issue" and "Include the
            // failing job/assertion in the issue body (today: run URL only)". This is that
            // option. (An earlier revision of this message denied the credit, because a
            // review finding was accepted without being checked against the plan doc.)
            //
            // Same shape as enforce-skills.yml's dedup (paginate + find by title); this file
            // was the outlier. Recurrences are APPENDED as comments rather than overwriting the
            // body, so the occurrence history survives.
            //
            // RESIDUAL (round-2 review): the key is the failing JOB SET, not the root cause.
            // `extension-tests` multiplexes several suites, so two unrelated breakages inside
            // it still share a title. And there is no close-on-success here (unlike
            // enforce-skills.yml:109), so an issue stays open after main recovers and later
            // same-set failures append to it. Both are bounded and disclosed rather than fixed
            // here — close-on-success is a new mechanism, not a dedup fix.
            // `|| {}` after the parse too: NEEDS is the JSON rendering of `needs` (the
            // `toJSON` env injection in the `env:` block above), and a literal `null`
            // (not `{}`) makes Object.entries throw BEFORE the try/catch below, so the run would
            // error out having filed nothing. Not reachable today (all 7 jobs are wired into
            // `needs:`, so it is always a populated object) — but it is the only throw-before-filing
            // path in this step, and the safe direction here is "file", never "crash quietly".
            const failed = Object.entries(JSON.parse(process.env.NEEDS || '{}') || {})
              .filter(([, v]) => v.result === 'failure')
              .map(([k]) => k)
              .sort();
            const TITLE = failed.length
              ? `main broken by merge: ${failed.join(' + ')}`
              : 'main broken by merge';
            const detail = `Post-merge CI failed on main at ${context.sha}.\n` +
              `Failing jobs: ${failed.length ? failed.join(', ') : 'unknown'}\n` +
              `See: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // A duplicate beats silence: the old code always filed. If the lookup fails
            // (secondary rate limit, 5xx, a later page), fall through and still file.
            let issues = [];
            try {
              issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
            } catch (e) {
              core.warning(`issue lookup failed (${e.message}) — filing without dedup`);
            }
            const dup = issues.find(i => !i.pull_request && i.title === TITLE);
            if (dup) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: dup.number,
                  body: `Recurred: ${detail}`,
                });
                core.notice(`main broken again — appended to #${dup.number} instead of filing a duplicate`);
                return;
              } catch (e) {
                core.warning(`could not comment on #${dup.number} (${e.message}) — filing a new issue`);
              }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: TITLE,
              body: `${detail}\n\n_Recurrences with the same failing job set are appended to this issue rather than filed as duplicates (#937)._`,
              labels: ['bug'],
            });
