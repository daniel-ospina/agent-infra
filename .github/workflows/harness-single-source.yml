name: Harness single source

# The harness existed in three copies that disagreed (agent-infra / tortoise / ~/orchestrator), so
# every fix had to be applied by hand in 3-4 places and no box could self-heal. The consolidation is
# only real if a reappearing fork or a drifting deployed copy FAILS CI, so this job is the wiring —
# and it proves the check is NON-VACUOUS: a planted fork and a one-byte-divergent deployed copy must
# both be refused, and a run that compares nothing must exit 2 rather than pass.
#
# ⛔ ITS OWN WORKFLOW, ON PURPOSE — and that is a decision, not tidiness. This job used to live in
# ci.yml, which is a BYTE-LOCKED workflow (scripts/check-workflow-lock.mjs, LOCKED_FILES). Adding a
# job there forced this branch to also re-cut the lock entry for ci.yml, and every main commit that
# re-cut the lock made this branch CONFLICT, three times in one evening, each costing a rebase + a
# full CI run. (Since #1955 the lock is region-keyed, so that contention is scoped to `jobs.ci` —
# narrower, but a harness job would still land in the same region.) A dedicated
# workflow is classified once in `UNLOCKED_WORKFLOWS` (check-workflow-lock.mjs) and then never
# collides with a locked-file edit again. The job name is unchanged — `harness-single-source` — so
# the check that branch protection and the fleet's logs already reference still appears.
#
# ⛔ AND IT IS NOT WIRED INTO run-bash-shards.sh's step list on purpose: this job exists so a RED names
# the harness in a dedicated check instead of surfacing as one shard of a large job. The price of that
# dedicated name is ONE run site for the suites it owns — NOT TWO. `selftest.sh` already runs as a
# shard (scripts/run-bash-shards.sh, and therefore in BOTH lanes), so the step that re-ran it here was
# a duplicate on the same commit (86 s of this job's 94 s, measured on #2385's head run 39879010111)
# and was removed by agent-infra#2439. What keeps this workflow alive is the coverage that is NOT
# elsewhere — name it precisely, because "nothing else runs them" would be FALSE for two of the three
# non-vacuity steps: `selftest.sh` (itself a shard, so both lanes) already drives the divergent-copy
# rc-1 arm (`selftest.sh:3916-3918`) and the checking-nothing rc-2 arm (`selftest.sh:3954-3956`).
# The arms unique to this job are the PLANTED-FORK refusal (the "NON-VACUITY — a planted fork is
# refused" step — `selftest.sh` pins three `--fork` refusals and every one of them is rc 2: an
# existing-but-empty dir, `--fork == canonical`, and an unsearchable fork; none is a reappearing
# dupe at rc 1) and the REAL-RUNNER `doctor` assertions (the "doctor reports the platform and the
# supervisor it found" step — `selftest.sh` drives `doctor` only against stubs and temp trees).
# Kept because those two have no other run site; the other two are pinned twice on purpose, so a
# weakening at one site must be met by the other rather than read as "nothing to keep in sync".
# ⛔ No line numbers for the steps above, deliberately: citing them made THIS comment stale the
# moment it was inserted (its own 7 added lines moved both targets), which is the same defect the
# fold fixed in ci.yml's "shard 192" pointer. A name survives an edit; a line number does not.

# ⛔ A `paths:` FILTER, BECAUSE A DIFF THAT CANNOT CHANGE THIS READ SHOULD NOT BUY A RUN (#3196).
# This job ran on EVERY PR at a 6.7 min median wall clock for a few seconds of work (measured
# 2026-11-01), and `pipeline-compliance` — the repo's only required context — queues behind it.
# The filter is scoped to what the steps below can READ, and it errs WIDE on purpose: the measured
# history of this file is that an arm which is right about `bin/harness` was wrong about the
# MACHINE it landed on (#3001), so the rule is "everything the read depends on", never "the file
# under test".
#
#   bin/harness                                — the CLI the `doctor` step executes and asserts.
#   scripts/orchestrator-harness/**            — doctor's CANONICAL tree: it reads this directory's
#                                                git HEAD and dirty state (`canonical.commit` is
#                                                asserted to BE this run's head), runs
#                                                check-single-source.sh from it, and every
#                                                NON-VACUITY step compares files in it (the
#                                                `--require-target` copy, the planted fork's
#                                                `lane.sh`, the byte-divergent `spawn-gate.sh`).
#                                                The supervisor probe also sources
#                                                `orchestrator-harness/worker-terminal.sh` and
#                                                `orchestrator-harness/uv-env.sh` from here.
#   scripts/cloud-cell-supervisor.sh           — the Linux supervisor installer doctor resolves
#                                                (`$_sup_sh`) and EXECUTES `status` on, so its
#                                                behaviour is part of the read.
#   .github/workflows/harness-single-source.yml — this file: an assertion or step change must be
#                                                able to run on its own PR.
#
# DELIBERATELY EXCLUDED, each with the reason it cannot change the read (do not "tidy" one in
# without one):
#   * `scripts/lib/**` — the doctor path sources only `orchestrator-harness/uv-env.sh` and
#     `orchestrator-harness/worker-terminal.sh`; `scripts/lib/pid-identity.sh` and
#     `scripts/lib/box.sh` are PINNED MIRRORS whose predicates the supervisor carries its own copy
#     of, so editing them changes neither doctor's output nor a step's input.
#   * `docs/**`, `templates/**`, `extensions/**`, `bin/agent-infra.js` — no step here executes or
#     reads any of them.
#   * every OTHER workflow — this job reads no workflow file but its own.
#
# ⛔ NOT ON THE REQUIRED CONTEXT, AND THAT IS WHY THIS IS SAFE HERE AND WOULD NOT BE THERE. GitHub
# documents that "if a workflow is skipped due to path filtering … then checks associated with that
# workflow will remain in a 'Pending' state", so a filtered REQUIRED context would block merges.
# `pipeline-compliance` is this repo's only required context (measured) and its triggers are
# untouched on purpose. For an advisory check the missing run is simply absent, and
# `scripts/admin-merge.sh` already models a `paths:`-filtered PR workflow on the base-side
# comparison (#1542 at :5202) rather than treating the absence as a gap.
#
# The set is pinned by `tests/ci-trigger-scope`, whose admission arms go through
# `scripts/ci-workflow-pr-evaluable.sh` — the SAME predicate the merge rail uses — so a filter that
# stops admitting one of the paths above is RED rather than a quiet coverage loss.
on:
  pull_request:
    paths:
      - 'bin/harness'
      - 'scripts/orchestrator-harness/**'
      - 'scripts/cloud-cell-supervisor.sh'
      - '.github/workflows/harness-single-source.yml'

concurrency:
  # Supersede a run when the branch moves; a superseded run is not a failure (the rail treats
  # `cancelled` as non-red).
  group: harness-single-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness-single-source:
    runs-on: ubuntu-latest
    # #2055 — a job with NO bound can hang until the platform's 6-hour ceiling, and this one runs on
    # every PR whose paths filter matches, so a hang holds the merge queue (measured on PR #2168: a
    # peer job sat `in_progress` for >55 min and the rail refused to classify anything). Measured over
    # 14 completed runs of this workflow (2026-11-09): p50 14 s, p90 74 s, max 156 s. 25 min is ~10x
    # the observed max — above runner variance, far below a hang.
    #
    # ⛔ THIS BOUND IS A BACKSTOP, NOT THE RED (stated so it is not misread): a job-level
    # `timeout-minutes` trip is reported `cancelled`, which this repo's rail reads NON-RED. What it
    # buys is that the job ENDS and NAMES itself instead of queueing every PR behind it forever. The
    # red-producing bound is the step's — see ci.yml's `bash-suites` — and the false-pass surface a
    # non-verdict leaves behind is ONE root, agent-infra#3242, not a new one created here.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: doctor reports the platform and the supervisor it found
        # ⛔ THIS STEP ASSERTS VALUES, NOT KEY PRESENCE (review P2, this round). It used to be
        # `out="$(bin/harness doctor --json || true)"` plus `assert "supervisor" in d and
        # "canonical" in d` — measured against a degenerate payload
        # `{"platform":"linux","supervisor":null,"canonical":null,"verdict":"OK"}`, that
        # printed `doctor ok: OK linux None` and exited 0. So a `bin/harness` whose supervisor
        # detection always answered `null` — the confident-wrong-answer class this PR fixes — REDDED
        # NOTHING. That mattered because `bin/harness` has no other coverage anywhere. What is
        # asserted here is what is true of a fresh runner, plus a consistency check that cannot pass
        # on a broken read: the reported commit must BE this run's head, and the exit code must agree
        # with the published verdict.
        # ⛔ AND THE `deployed` SECTION IS CROSS-CHECKED AGAINST THE BOX, NOT ASSUMED (#3001). It used
        # to assert `d["deployed"]["kind"] == "absent"` under the comment "nothing is installed on a
        # runner" — and that is FALSE on this fleet's own runners. Measured at #3001's head, run
        # 40765771180: the job landed on self-hosted `ai-runner-cell3-x64-3` (machine `cmux`), whose
        # `$HOME/orchestrator` IS a deployment, so doctor honestly answered
        # `{"path":"/home/cmux/orchestrator","kind":"stamp","commit":"5cc38e3b…","bytes":"unchecked+bytes=DIFFERS"}`
        # and this step REDDED a correct read — while the same head passed on a GitHub-hosted runner.
        # An arm that reds one runner and greens another grades the RUNNER, not `bin/harness`. What
        # replaces it is the stronger question, and it is environment-independent: the reported kind
        # must be one of doctor's OWN documented states (`bin/harness` DEPLOY_KIND), and it must
        # agree with what is on disk — `absent` only where nothing is there, any other kind only
        # where something is (`unreadable` makes no claim, so it is not cross-checked). The
        # NON-VACUITY block at the end of this step reds if that cross-check ever stops refusing a
        # fabricated answer, so the repair cannot decay into a green no-op — and since #3045 those
        # mutations are FABRICATED rather than derived from the box, because a box-derived one was
        # invisible on exactly the runner the job usually lands on.
        run: |
          set -euo pipefail
          rc=0
          out="$(bin/harness doctor --json)" || rc=$?
          printf '%s\n' "$out"
          # ONE checker, kept in a file so the NON-VACUITY arm below runs the SAME program instead of
          # a restatement of it — a second copy is a copy that can drift silently green.
          chk="$(mktemp)"
          cat >"$chk" <<'PY'
          import json, os, sys
          d = json.loads(sys.argv[1])
          sha, rc = sys.argv[2], int(sys.argv[3])
          assert d["platform"] == "linux", d
          # A commit that cannot be read is reported as "UNKNOWN" — never as a plausible value.
          assert d["canonical"]["commit"] == sha, ("canonical.commit", d["canonical"], sha)
          # The deployed section is doctor's own CLOSED vocabulary; an unrecognised kind would mean
          # the arm invented an answer instead of choosing one of its documented states.
          dep = d["deployed"]
          KINDS = ("absent", "unreadable", "dangling", "checkout", "linked-checkout", "stamp", "orphan")
          assert dep["kind"] in KINDS, dep
          # … and it must AGREE WITH THIS MACHINE. This is the arm `== "absent"` used to make by
          # assuming a bare runner: `lexists` so a dangling symlink (kind `dangling`, `-e` false)
          # and a non-directory (kind `unreadable`) are not read as "nothing is there".
          if dep["kind"] == "unreadable":
              pass          # doctor's own word for "could not read it" — it makes no claim to check
          elif dep["kind"] == "absent":
              assert not os.path.lexists(dep["path"]), ("deployed.absent-but-present", dep)
          else:
              assert os.path.lexists(dep["path"]), ("deployed.present-but-absent", dep)
          # No fork paths are configured here, and the machine surface must SAY so rather than let a
          # consumer read "OK" as "forks verified".
          assert d["forksChecked"] is False, d
          # The vocabulary is closed; an unrecognised supervisor string would mean the arm invented an
          # answer instead of choosing one of its documented states.
          assert d["supervisor"] in ("none", "launchd", "systemd", "process", "other-repo"), d
          assert d["supervisorEvidence"], d
          # Exit code and verdict must agree: 0 OK, 1 DRIFT, 2 UNKNOWN.
          want = {"OK": 0, "DRIFT": 1, "UNKNOWN": 2}[d["verdict"]]
          assert rc == want, ("verdict", d["verdict"], "rc", rc, "want", want)
          print("doctor ok:", d["verdict"], d["platform"], d["supervisor"], "deployedKind=", dep["kind"], "forksChecked=", d["forksChecked"])
          PY
          check() { python3 "$chk" "$1" "$GITHUB_SHA" "$2"; }
          check "$out" "$rc"

          # NON-VACUITY — the cross-check above must REFUSE a fabricated deployed answer, and it
          # must do so on BOTH of its branches. ⛔ THE MUTATIONS BELOW ARE FABRICATED, NEVER DERIVED
          # FROM THE BOX (#3045). This arm used to read `present = os.path.lexists(dep["path"])` and
          # flip the kind away from what it observed — which made the arm a function of the runner, in
          # the one direction that matters: on a BARE GitHub-hosted runner (kind `absent`, nothing on
          # disk — the population this job mostly lands on, and the state `paths:` keeps it running in)
          # the flip emitted `stamp`, and the OLD `assert dep["kind"] == "absent"` refused `stamp` too,
          # so a VERBATIM REVERT of the cross-check left this step exiting 0 and printing
          # `✅ non-vacuity` over a checker that cross-checked nothing. Measured 2026-11-10 against a
          # reproduction of this step: reverted checker revealed by the bare-runner case ⇒ arm exit 0
          # (blind), and on a box WITH a deployment the revert reds the FIRST `check` instead of this
          # arm — so the regression was never attributable to the guard that exists to name it. A path
          # the mutation asserts into existence makes both arms gradable on any machine (#3045's own
          # prescription), and each branch of the cross-check now has its own contradictory payload.
          mut="$(mktemp)"
          cat >"$mut" <<'PY'
          import json, sys
          d = json.load(sys.stdin)
          dep = d["deployed"]
          # REALITY: this path exists on every runner. THE ANSWER: nothing is there.
          dep["path"] = "/"
          dep["kind"] = "absent"
          sys.stdout.write(json.dumps(d))
          PY
          mutated="$(printf '%s\n' "$out" | python3 "$mut")"
          if check "$mutated" "$rc" >/dev/null 2>&1; then
            echo "❌ NON-VACUITY: the doctor cross-check ACCEPTED an 'absent' beside a path that exists: $mutated"
            exit 1
          fi
          echo "✅ non-vacuity: a fabricated 'absent' is refused"

          # … and the OTHER branch: an answer claiming something IS there, beside a path that is not.
          # Both directions are pinned so that deleting EITHER branch of the cross-check is caught
          # here instead of decaying into a green no-op.
          mut2="$(mktemp)"
          cat >"$mut2" <<'PY'
          import json, sys
          d = json.load(sys.stdin)
          dep = d["deployed"]
          # REALITY: nothing can be here. THE ANSWER: a deployment is.
          dep["path"] = "/nonexistent-0000000000000000"
          dep["kind"] = "stamp"
          sys.stdout.write(json.dumps(d))
          PY
          mutated2="$(printf '%s\n' "$out" | python3 "$mut2")"
          if check "$mutated2" "$rc" >/dev/null 2>&1; then
            echo "❌ NON-VACUITY: the doctor cross-check ACCEPTED a 'stamp' beside a path that does not exist: $mutated2"
            exit 1
          fi
          echo "✅ non-vacuity: a fabricated present-kind is refused"
      - name: canonical copy is complete (the source of truth has all shared files)
        run: |
          set -euo pipefail
          bash scripts/orchestrator-harness/check-single-source.sh
      - name: a REAL comparison passes (deployed copy identical to canonical)
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          cp scripts/orchestrator-harness/*.sh "$d"/
          bash scripts/orchestrator-harness/check-single-source.sh --require-target --o "$d"
      - name: NON-VACUITY — a planted fork is refused
        run: |
          set -euo pipefail
          mkdir -p /tmp/planted-fork
          cp scripts/orchestrator-harness/lane.sh /tmp/planted-fork/lane.sh
          rc=0
          bash scripts/orchestrator-harness/check-single-source.sh --fork /tmp/planted-fork || rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: a reappearing fork must exit 1, got $rc"; exit 1; }
      - name: NON-VACUITY — a divergent deployed copy is refused
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          cp scripts/orchestrator-harness/*.sh "$d"/
          printf '%s\n' '# drift' >> "$d/spawn-gate.sh"
          rc=0
          bash scripts/orchestrator-harness/check-single-source.sh --o "$d" || rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: a byte-divergent deployed copy must exit 1, got $rc"; exit 1; }
      - name: NON-VACUITY — checking nothing is UNKNOWN, never a pass
        run: |
          set -euo pipefail
          rc=0
          bash scripts/orchestrator-harness/check-single-source.sh --require-target --quiet || rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL: --require-target with no target must exit 2, got $rc"; exit 1; }
