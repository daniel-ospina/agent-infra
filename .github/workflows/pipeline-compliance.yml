name: Pipeline Compliance
# Deterministic (no-LLM) CI gate — verifies a PR followed the agent pipeline
# (issue-scoping → plan → code-review) before merge. Runs the
# scripts/check-pipeline-compliance.sh gate. Independent job: no `needs`,
# runs alongside other CI and reports its own check status.
#
# DOGFOOD COPY — agent-infra runs its own gate (issue #145). Adapted from
# templates/.github/workflows/pipeline-compliance.yml for THIS repo:
#   * Job name is `pipeline-compliance` — main branch protection requires
#     EXACTLY this check context. Keep the name stable: renaming the job
#     silently disables the required check.
#   * `pull_request` trigger scoped to PRs targeting main (where branch
#     protection applies). `workflow_call` is kept so consumer repos can
#     reuse this file directly (thin caller + `uses: ...@main`).
#   * The script lives IN this repo (scripts/check-pipeline-compliance.sh):
#     the gate runs the checked-out copy, so a PR's script changes are
#     tested by the gate itself. No auto-fetch — a missing script is a hard
#     error, not a reason to fetch the main-branch copy.

on:
  workflow_call:
    inputs:
      pr-number:
        type: string
        required: false
        description: 'PR number to gate (required when called via workflow_call).'
      repo:
        type: string
        required: false
        description: 'owner/repo to check against. Defaults to github.repository.'
      skip:
        type: boolean
        required: false
        default: false
        description: 'Emergency override — skip the gate with a loud warning.'
  pull_request:
    branches:
      - main
    # #513: `types` is REQUIRED for the check-(c) verdict binding to fire at
    # all — record-review.sh PATCHes the review marker into the PR body at
    # record time (an `edited` activity), which happens AFTER the last push.
    # Without `edited`, the default opened/synchronize/reopened types never
    # re-run the gate post-marker, so a forged `verdict=clean-micro` marker
    # would ride a stale green check to merge. With `edited`, a merge
    # attempted AFTER the re-run settles red is blocked by branch protection.
    # Note: fast same-ceremony first-attempt merges inside the webhook-dispatch
    # race are not deterministically caught (see #513 plan Risk Register).
    types:
      - opened
      - synchronize
      - reopened
      - edited

  # ⛔ CHECKS (b) AND (d) READ THE LINKED *ISSUE*, WHICH FIRES NO PR EVENT (#2467).
  # This trigger is the missing arm, and without it the repo's ONLY required check
  # is non-deterministic in time. Measured 2026-10-31 on PR #3122 head 3be41e42:
  #   run 41162232810  pull_request  attempt=1  failure   executed 03:16:06Z
  #     log: "❌ [b] no scoping comment on issue #3121"
  #   issue #3121 scoping comment created         03:18:15Z
  #   run 41162251521  pull_request  attempt=1  success   executed 03:19:44Z
  # Two runs of the SAME check on the SAME commit disagreed, and nothing decided
  # the difference but queue latency — the second run had been queued since
  # 02:57:30Z. So an `issue_comment` carrying the scoping marker re-runs the
  # existing gate run for each OPEN PR cross-referencing that issue.
  #
  # HONEST SCOPE — WHAT THIS DOES **NOT** COVER. The linked issue's
  # `complexity:` LABELS are check-(b)–(e)'s other out-of-head input (a
  # `complexity:micro` label skips b–e entirely), and setting a label is an
  # `issues: labeled` event, which also fires no `pull_request` event. That arm
  # is NOT added here and the window stays open for it; closing it needs the same
  # rerun logic keyed on a labels event. Do not read this trigger as covering
  # labels. A second, narrower window: a comment landing while the newest run for
  # the head is already `in_progress` is skipped (the API cannot re-run an
  # in-flight run), so that one run can still mint a verdict nothing re-reads.
  #
  # ⛔ THE `edited` ARM IS BIDIRECTIONAL AND MUST BE READ THAT WAY. Retracting the
  # marker is an edit that REMOVES `<!-- issue-scoping:`, and a one-sided read of
  # the new body would call that "nothing changed" and leave the previous GREEN
  # standing on evidence that no longer exists — a fail-open. So the prior body
  # (`github.event.changes.body.from`, absent on `created`) is probed too, and a
  # retraction forces a re-read EVEN OF A GREEN RUN — a retraction's newest run is
  # green by construction, so a polarity that only re-runs reds would leave the
  # stale verdict standing while the log claimed otherwise (measured: the first
  # version printed "re-reading the gate" and then dispatched nothing).
  #
  # WHAT THIS IS NOT: it does not post, edit or re-post any marker (that would be
  # manufacturing evidence), it does not touch the gate's logic or any refusal
  # class, and it cannot turn a red into a green — it re-runs the SAME check over
  # the CURRENT issue state, so a red that comes back stands. It also cannot
  # approve a PR: the job holds no `contents: write` and never checks out the PR.
  issue_comment:
    types:
      - created
      - edited

# NO `concurrency:` BLOCK, DELIBERATELY (#2474) — and the same reasoning applies to
# `.github/workflows/workflow-lock.yml`. A per-PR group cannot tell a head from its
# successor (the key is the PR, not the sha), so a `gh run rerun` of a SUPERSEDED
# head arrives in the SAME group as the newest head and cancels its in-flight run.
# Concurrency orders by ARRIVAL, not head age. That is a fail-open here, not a
# speed-up: `cancelled` is in `NON_RED_CONC` (scripts/admin-merge.sh) and counts as
# measured-nothing, so the repo's ONLY required status check (#646) would read
# non-red with no verdict on the newest tree — and stale-head reruns are observed
# on this workflow. Fix the rail first (#2474), then add supersession.
#
# A superseded-head run here IS wasted work (measured on #2474); it is left in place
# because the alternative loses verdicts rather than runner-minutes.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pipeline-compliance:
    name: pipeline-compliance
    # `issue_comment` must never satisfy the required context: this job runs the
    # gate for a PR only. The revalidation job below owns the comment event.
    if: github.event_name != 'issue_comment'
    # ── THE REQUIRED-CHECK RESERVATION (#2752) ────────────────────────────────────────────
    # THE DEFECT. `pipeline-compliance` is this repo's ONLY required status context
    # (branch protection = exactly `["pipeline-compliance"]`, measured) and ~9 s of work.
    # It queues behind ADVISORY work that consumes every runner: measured 2026-10-24
    # 21:43:45Z, one run waited 13 min for 9 s of work, while 66 runs (~1,650 jobs) were
    # queued and `bash-suites` alone is 8 matrix jobs. A required check that is `queued`
    # is indistinguishable from a broken pipeline, so nothing merges for hours.
    #
    # THE FIX. Reserve slots (this design assumes FOUR) carrying the label `required-check`, which
    # ONLY this job asks for: one operator adds the label per docs/ops/fleet-capacity.md §9.2 and
    # sets PIPELINE_COMPLIANCE_RUNS_ON per §9.3. ⛔ NOTHING IS RESERVED TODAY — no runner carries
    # `required-check` and the variable is unset, so this job still runs on `ubuntu-latest`. Do not
    # engage the variable before the label exists: a reserved routing with no listener queues to the
    # 24 h cancel and lands `cancelled`, which is non-red in the merge rail (§9.4).
    # Same check, same commit, same assertions — it just does not wait behind 1,600 advisory jobs.
    # No other job's routing is touched (see tests/required-check-reservation).
    #
    # ⛔ WHY THE RESERVATION IS OPT-IN, AND WHY THE FALLBACK IS THE *DEFAULT*. `runs-on` has NO
    #   fallback/OR semantics in GitHub Actions: a label list is ANDed, and a job whose labels
    #   match no ONLINE runner does not run at all — it sits `queued` until GitHub cancels it (the
    #   self-hosted job-queue limit is 24 h: "A job can be in the queue for 24 hours before it is
    #   automatically cancelled"). Making `[self-hosted, Linux, X64, required-check]`
    #   the unconditional default would therefore mean (a) the repo's only required check is
    #   unsatisfiable until an operator labels a runner — the "worse than today" failure — and
    #   (b) every consumer that reuses this file via `workflow_call` (the header keeps that path
    #   open) would stall on a label it has never heard of. So the default IS the
    #   fallback: `ubuntu-latest`, i.e. exactly today's behaviour. The reservation is engaged by
    #   one variable, and releasing it is the same one command.
    #
    # ⛔ AND THE 24 h CANCEL IS NOT A SAFE PLACE TO WAIT. A `cancelled` check is in `NON_RED_CONC`
    #   (scripts/admin-merge.sh), so an engaged-but-unlabelled reservation would end as a NON-RED
    #   required check rather than a visible `queued` one — the rail's own fail-open class
    #   (#2474). That is the second reason the fallback is the default, and why §9.3 sets a 24 h
    #   release deadline instead of telling an operator to watch for `queued`.
    #
    # ⛔ WHY NOT A SECOND JOB OR A MATRIX ARM. Branch protection requires the context to be named
    #   EXACTLY `pipeline-compliance`. A matrix arm renames the context to
    #   `pipeline-compliance ([...])`, and a second job reports a DIFFERENT context — either way
    #   the required context is never satisfied and every PR blocks. The route must stay ONE job
    #   with ONE `runs-on`, which is why the fallback lives in the expression below.
    #
    # RESERVATION  (the value the operator sets; `required-check` is the reserved label):
    #   ["self-hosted","Linux","X64","required-check"]
    # ENGAGE + RELEASE are in docs/ops/fleet-capacity.md §9.2/§9.3 — the exact label call and the
    # `gh variable` call, so the reservation is reproducible rather than folklore. §9.2 uses the
    # NON-DESTRUCTIVE pair (`POST …/labels` to add, `DELETE …/labels/<name>` to remove) because
    # `PUT …/labels` REPLACES every custom label on the runner. The reserved runners must NOT also
    # carry `ubuntu-latest`, or advisory jobs take the reserved slots and the reservation is only
    # advisory.
    #
    # ⚠️ RECORDED DECISION THIS TOUCHES. #2682 recorded "keep the required check off self-hosted
    #   capacity until 1 and 2 are true" (a dedicated ephemeral, credential-free runner; a fixed
    #   restart loop). Turning the reservation ON reverses that posture for this job, and is
    #   therefore an operator decision, not an agent one — which is exactly why it ships OFF by
    #   default. See the PR body and the #2682 comment for the residual.
    runs-on: ${{ fromJSON(vars.PIPELINE_COMPLIANCE_RUNS_ON || '["ubuntu-latest"]') }}
    # #2055 — a job with no `timeout-minutes` that hangs holds a runner indefinitely; on the
    # RESERVED slots that is a silent outage of the only required check. 20 min is ~130x the
    # measured 9 s of work and still well inside a GitHub-hosted job's 6 h ceiling.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run pipeline compliance gate
        env:
          GH_REPO: ${{ inputs.repo || github.repository }}
          PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
          PIPELINE_COMPLIANCE_SKIP: ${{ inputs.skip && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/check-pipeline-compliance.sh ]; then
            echo "❌ scripts/check-pipeline-compliance.sh missing from checkout — agent-infra owns this gate; refusing to fetch." >&2
            exit 2
          fi
          bash scripts/check-pipeline-compliance.sh

      - name: Run the gate's fixture suite
        # #991 — the parser/fixture suite was executed by NOTHING. The env var is
        # set nowhere outside the script itself (grep: only the script's own
        # help text and its own guard), and this job ran the gate only —
        # ci-main.yml's extension leg said so outright ("pipeline-compliance.yml
        # is also PR-triggered, but runs no test suite"). That line is now stale,
        # and this step is what makes it so; it is not corrected here because
        # ci-main.yml is pinned in scripts/workflow-lock.json and a comment
        # tweak would force a lock re-derivation. (Cited by its TEXT, not by a
        # line number: the coordinate had already rotted from :98 to :55-56 to
        # :155 as its neighbours moved, and a number that rots argues for the
        # wrong thing - #3131's own preamble states the rule.) A fixture nothing
        # runs pins
        # nothing, so every assertion the suite carries — expect_ref,
        # expect_trace, pr_is_artifact_only, resolve_issue_ref, and the
        # has_scoping_marker family added by #991 — was decorative.
        #
        # CI is the AUTHORITATIVE venue for it: the required check runs the suite
        # on every PR, so a regression cannot land unseen.
        #
        # ⛔ CORRECTION — the sentence that stood here claimed the #1484
        # main-worktree-guard made CI the ONLY venue by blocking local execution.
        # That is FALSE at this head and was already false when this line was
        # written. `extensions/main-worktree-guard/index.ts` lists
        # `scripts/check-pipeline-compliance.sh` by name in
        # `SANCTIONED_SCRIPT_RELPATHS` — the sanctioned-script exemption exists
        # exactly so hub-rooted sessions can run it (#1129, extended to framework
        # checkouts by #2332) — and the suite's own recursive deletes target
        # `mktemp -d` dirs it created itself, so the discard walk allows it too.
        # Measured 2026-10-31 at this head: `PIPELINE_COMPLIANCE_SELF_TEST=1 …`
        # exits 0 from BOTH the hub checkout and a linked worktree, while the
        # guard was demonstrably live in the same session (it refused unrelated
        # scripts). Corrected rather than deleted: a rationale that an agent
        # cannot run the gate locally is the reason someone re-derives it from CI
        # logs instead of just running it, and stale claims are how that starts.
        #
        # NOT a new gate. This executes a suite the script ALREADY ships and
        # which already asserts; it adds no requirement a PR must satisfy and
        # changes no check's verdict. It is pure shell with no gh calls, so it
        # needs no token and cannot flake on API availability.
        env:
          GH_REPO: ${{ inputs.repo || github.repository }}
        run: |
          set -euo pipefail
          # The self-test seam is a hard requirement of this script. If it is
          # ever renamed or removed, FAIL LOUDLY rather than skipping: a bare
          # `exit 0` here would be a silent no-op of the exact class #991
          # removes — the suite would quietly stop running while the job stayed
          # green, which is how check (b) rotted into a substring match in the
          # first place.
          #
          # This step is therefore fail-closed for EVERY caller, including a
          # consumer that reuses this file via workflow_call against a script
          # copy predating the seam. That is deliberate. An earlier version
          # skipped with a `::notice::` when a hardcoded repo slug did not
          # match, which review flagged twice: first because `exit 0` anywhere
          # is a silent no-op, then because `github.repository` is not stable
          # across a rename or transfer — so renaming this repo would have
          # silently downgraded this repo's own run to the skip path. A loud,
          # self-explaining error costs a consumer one build; a silent skip
          # costs everyone the guarantee.
          if ! grep -q 'PIPELINE_COMPLIANCE_SELF_TEST' scripts/check-pipeline-compliance.sh; then
            echo "::error::scripts/check-pipeline-compliance.sh carries no PIPELINE_COMPLIANCE_SELF_TEST seam, so the fixture suite cannot run — and a fixture nothing runs pins nothing (#991). If this is a consumer copy that predates the seam, either update it or stop calling this workflow."
            exit 1
          fi
          PIPELINE_COMPLIANCE_SELF_TEST=1 bash scripts/check-pipeline-compliance.sh

      - name: AGENTS.md materialize gate suite (#1027 — base-owned region pin)
        # #1027 — `scripts/materialize-agents.sh --check` validated the base rule
        # headings by PRESENCE only: a base-owned paragraph could be deleted, or a
        # universal rule silently reworded, while `--check` still printed a green
        # ✅. That is exactly the class the gate exists to prevent (a stub ships
        # ZERO universal rules — #600), one level down. The suite pins it: a
        # missing required heading exits 1; base-owned content drift is reported
        # and never rendered as a plain ✅.
        #
        # Why this job: `pipeline-compliance` is the repo's ONLY required status
        # check (#646), so this is the one place the suite blocks a merge. It also
        # runs in ci.yml's `drift-check` job, where it is visible but not
        # merge-blocking. HONEST SCOPE: every CI gate in this repo is PR-editable
        # (#713 class) — a PR that removes this step or no-ops the suite can still
        # merge green. The step is fail-closed for *suite-file-missing*, not for
        # deliberate removal.
        #
        # The self-integrity grep sits INSIDE the suite-exists branch on purpose:
        # on a consumer checkout reusing this file via workflow_call the suite is
        # absent by design, and running the grep there would red a legitimate
        # consumer build.
        run: |
          set -euo pipefail
          if [ -f tests/materialize-agents/run.sh ]; then
            # Assert the PIN CONSTRUCT, not a bare two-character substring. The
            # first revision used `grep -q '^<'`, which in BRE is an ANCHOR — it
            # can only match a line that begins with `<`, which no line of the
            # suite does. It therefore exited 1 on every PR, turning the repo's
            # ONLY required check red (caught by the #1027 adversarial review).
            #
            # A plain `grep -qF <literal>` is not enough either: it matches a
            # COMMENTED-OUT invocation, so a one-character `#` would silently stop
            # the pin while this guard stayed green (reproduced in review). The
            # awk below skips comment lines and matches the literal with index(),
            # so only a live invocation satisfies it. Single-quoted: `$BASE` and
            # `$ROOT` are awk's, not the shell's. No pipe, so no SIGPIPE risk.
            #
            # Residual, stated plainly: this is a source-text tripwire, not a
            # proof the pin RAN. A PR that edits the suite to make the pin a no-op
            # is the repo's disclosed #713 class (every CI gate here is
            # PR-editable); the suite's own positive control is what pins the
            # pin's behaviour.
            if ! awk 'BEGIN{s="diff --text \"$BASE\" \"$ROOT/AGENTS.md\""} /^[[:space:]]*#/{next} index($0,s){f=1} END{exit(f?0:1)}' tests/materialize-agents/run.sh; then
              echo "::error::tests/materialize-agents/run.sh carries no live real-repo pin — the #1027 base-owned-region assertion cannot be trusted."
              exit 1
            fi
            bash tests/materialize-agents/run.sh
          elif [ -f pi-bootstrap/setup.sh ] || { [ -f manifest.json ] && [ -f bin/agent-infra.js ]; }; then
            # Two signals, each agent-infra-ONLY. `pi-bootstrap/` is never shipped
            # to consumers; `bin/agent-infra.js` likewise. A bare `manifest.json`
            # is NOT one of these — it is a generic filename (PWA/extension
            # manifests), and this workflow is reusable by consumers via
            # `workflow_call`, so testing it alone would red a legitimate consumer
            # build (found in the #1027 review).
            echo "::error::agent-infra checkout detected but tests/materialize-agents/run.sh is missing — the #1027 base-owned-region pin would silently stop running."
            exit 1
          else
            echo "::notice::consumer checkout — materialize-agents suite skipped"
          fi

  # ── Re-run the required check when ITS INPUT changes on the ISSUE (#2467) ──
  # Checks (b)/(d) read the linked issue's `<!-- issue-scoping:` comment. That
  # object is outside the PR's event surface, so a red minted before it existed
  # survives after it exists. This job closes that window by re-running the
  # EXISTING gate run for each open PR that cross-references the commented issue.
  # See the trigger block's header for the measured two-runs-one-sha evidence, and
  # for the `complexity:` LABELS arm this does NOT cover.
  #
  # Permissions are the whole risk surface, so they are enumerated and minimal:
  #   actions: write      — `POST /actions/runs/<id>/rerun`, and nothing else
  #   issues/pulls: read  — the timeline and the PR head
  #   contents: read      — the checkout of THIS repo's scripts at the default
  #                         branch (never the PR's tree: `issue_comment` has no
  #                         PR context, so there is no untrusted ref to reach)
  # The job never runs an untrusted artifact and never writes to the API except
  # `rerun`, which reproduces a check — it cannot mint a verdict.
  revalidate-on-issue-comment:
    name: revalidate-on-issue-comment
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Revalidate the required check against the current issue state
        # The comment body goes through the ENVIRONMENT, never inline: a comment
        # body is attacker-influenced text and `${{ }}` interpolation would run
        # it in the shell before the script saw it.
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          # The body this comment REPLACED, so a marker RETRACTION re-reads the
          # gate instead of leaving a stale green standing. Absent on `created`
          # (the expression yields an empty string), which is why the trust and
          # marker checks are unaffected on the add path.
          PREVIOUS_COMMENT_BODY: ${{ github.event.changes.body.from }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail
          # Fail LOUD if the script is absent, never exit 0: a silent no-op of a
          # revalidation is the class this job exists to remove.
          if [ ! -f scripts/revalidate-required-check-on-issue-comment.sh ]; then
            echo "::error::scripts/revalidate-required-check-on-issue-comment.sh missing from checkout — the issue-comment revalidation arm cannot run" >&2
            exit 1
          fi
          bash scripts/revalidate-required-check-on-issue-comment.sh

      - name: Revalidation self-test (the pure decisions)
        run: |
          set -euo pipefail
          if ! grep -q 'REVALIDATE_SELF_TEST' scripts/revalidate-required-check-on-issue-comment.sh; then
            echo "::error::scripts/revalidate-required-check-on-issue-comment.sh carries no REVALIDATE_SELF_TEST seam — its decisions would be unpinned" >&2
            exit 1
          fi
          REVALIDATE_SELF_TEST=1 bash scripts/revalidate-required-check-on-issue-comment.sh

  workflow-drift:
    # The same guard the required job carries: a comment cannot change a reusable
    # workflow's bytes, so an `issue_comment` run would spend a full checkout + diff
    # on every comment in the repo and could attach a spurious `workflow-drift`
    # red to the default-branch head.
    if: github.event_name != 'issue_comment'
    # #303 drift guard — reusable workflows must be REAL COMMITTED FILES in
    # .github/workflows/, materialized from templates/ by
    # scripts/sync-ci-workflows.sh. GitHub Actions CANNOT parse symlinked
    # workflow files (#555): the loader reads the blob, not the checkout
    # filesystem. This job fails on (a) a template edit without
    # materialization, or (b) any symlink under .github/workflows/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reusable workflows match templates
        run: |
          failures=0
          # #930 — admin-merge-detector.yml is materialized here too so the
          # post-merge detector reaches consumers via the same sync path.
          for f in python-ci.yml node-ci.yml docs-ci.yml admin-merge-detector.yml; do
            if ! diff -q "templates/.github/workflows/$f" ".github/workflows/$f" >/dev/null 2>&1; then
              echo "::error::$f differs from templates/.github/workflows/$f — edit the template, then run scripts/sync-ci-workflows.sh and commit the materialized copy"
              failures=$((failures+1))
            fi
          done
          if [ "$failures" -gt 0 ]; then exit 1; fi
          echo "✅ all reusable workflows match templates"
      - name: No symlinks under .github/workflows
        run: |
          SYMLINKS=$(find .github/workflows -type l | wc -l | tr -d ' ')
          if [ "$SYMLINKS" -ne 0 ]; then
            find .github/workflows -type l
            echo "::error::symlinks under .github/workflows/ are invalid on GitHub Actions (#555) — replace with real files"
            exit 1
          fi
          echo "✅ no symlinks under .github/workflows"
