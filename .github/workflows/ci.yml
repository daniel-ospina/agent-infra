        # it. The drift-pins that stop the two extensions re-declaring their own
        # copies live in their SDK-bearing index.test.ts (post-merge glob).
        run: npx tsx extensions/shared/git-command-parse.test.ts
      - name: Load-scale doc↔code contract (#1073, zero-dep)
        # #1073 — docs/ops/load-policy.md once named two watchdog scale knobs
        # (`TASK_LOAD_SCALE_START` / `_MAX`) that no code read: an operator set
        # one and got nothing. The root cause was a rebase that merged one #209
        # implementation's code with the other's doc, and NOTHING compared a
        # documented env var against an actual reader. This suite is that gate:
        # (a) every env var the doc names must have a non-test reader
        # (or be a declared constant), (b) §6's band sentence is parsed and must
        # equal the code's literals, (c) the two keep-in-sync copies
        # (`loadScaledBound` / `loadScaledTimeoutMs`) must stay byte-identical
        # and must read exactly `TASK_LOAD_SCALE_OFF`. Zero-dep (`node:*` only),
        # so it MUST run in THIS job — the job that performs no `npm ci`.
        # VISIBLE, not merge-blocking (`pipeline-compliance` is the only required
        # check, #646); the BLOCKING backstop is the post-merge ci-main.yml
        # `extensions/shared/*.test.ts` glob, which picks this file up too.
        run: npx tsx extensions/shared/load-scale-contract.test.ts
      - name: Task-run record + retention suite (#1662, zero-dep)
        # #1662 — extensions/shared/task-runs.ts imports `node:*` ONLY, so its
        # suite runs in THIS job (the job that performs no `npm ci`), like the
        # loop-enforcer and load-scale suites around it. VISIBLE, not
        # merge-blocking: `pipeline-compliance` is the repo's only required
        # check (#646), so the BLOCKING backstop remains the post-merge
        # ci-main.yml `extensions/shared/*.test.ts` glob. Its own step on
        # purpose — a `&&` chain would let one suite's failure suppress the
        # other's verdict — and NOT appended to the `test-command` accumulator
        # above, which check-pi-pin-lockstep.mjs (guard (j)) pins byte-exactly.
        # What this step buys is that the durable-run-record contract (atomic
        # writes, path gate, retention dry-run, collect idempotence) FAILS
        # where the author can see it before merge, instead of only after it
        # (#1250: a suite wired only into ci-main.yml runs post-merge).
        run: npx tsx extensions/shared/task-runs.test.ts
      - name: Reviewer pre-flight disclosure drift pin (#2148, zero-dep)
        # #2148 — the reviewer requirement was disclosed only at the finish line, so three lanes did
        # their whole job on 2026-10-19 and were then refused at the rail. The disclosure's ONE
        # wording lives in extensions/shared/reviewer-preflight.ts (pi side) and
        # scripts/orchestrator-harness/reviewer-preflight.sh (harness side); this suite compares the
        # RENDERED lines byte for byte in both directions, and pins that the line is one line, names
        # the dispatch/record/rail commands, and stays honest under a gate bypass.
        # Zero-dep (`node:*` only) so it runs in THIS job (no `npm ci`); the BLOCKING backstop is the
        # post-merge ci-main.yml `extensions/shared/*.test.ts` glob, which picks this file up too.
        run: npx tsx extensions/shared/reviewer-preflight.test.ts
      - name: Headless-lane contract suite (#2965, zero-dep)
        # #2965 — a guard must judge what the process IS, not who launched it. `lane.sh` exports
        # SKILL_ENFORCER_DISABLED=1 for its own lanes; a headless `pi -p` started any other way (a
        # cloud-cell dispatch, a hand-run "pi -p … --no-session") got the gates and none of the
        # affordances, so its `git commit` was refused and the lane exited with ZERO commits —
        # measured 2026-10-27, and silent, because nothing fails loudly when a gate simply says no.
        # This suite builds a REAL hub and REAL linked worktrees with git and pins BOTH arms: a
        # derived lane acts, the hub stays guarded. Both halves matter — a suite that only pinned
        # the worktree arm would accept a change that lifted the hub gate (what #618/#621 measured).
        # Zero-dep (`node:*`, ./headless-lane.js, ../skill-enforcer.js, the `git` binary), so it runs
        # in THIS job (no `npm ci`); the BLOCKING backstop is the post-merge ci-main.yml
        # `extensions/shared/*.test.ts` glob, which picks this file up too.
        run: npx tsx extensions/shared/headless-lane.test.ts
      - name: Headless-lane contract MUTATION evidence (#2965, zero-dep)
        # The suite above is only a pin if it can FAIL. Mutations reintroduce each arm's defect —
        # the derivation reverted so a linked worktree no longer derives a lane, and the historical
        # path-insensitive fail-open that treats EVERY checkout as a linked worktree (#618/#621) —
        # into a TEMP copy of the module, and into the wiring through the contract seam, requiring
        # each paired assertion to go RED and printing it verbatim. Its own step so neither verdict
        # can suppress the other (the rule every sibling suite here follows).
        run: npx tsx extensions/shared/headless-lane.test.ts --mutations
      - name: main-worktree-guard module-LOAD regression (#744)
        # The guard's bash-git classifier lost its LATER bindings SILENTLY in
        # every session from #697 until #744 (five rename-destructuring targets
        # declared nowhere → ReferenceError at module load, swallowed by the
        # load try/catch, leaving the fail-safe defaults for the bindings at or
        # after the abort point bound). No gate could see it: the
        # sibling extensions/main-worktree-guard/test.mjs imports
        # classify-git.mjs DIRECTLY, and the extensions/*/test*.mjs glob is
        # post-merge only (ci-main.yml). Its own step here, not a second
        # `test-command` line above — that value is pinned by
        # check-pi-pin-lockstep.mjs (guard (j)) to exactly this one accumulator
        # invocation.
        # Zero-dep (`node:*` + the `git` binary), no `npm ci`, ~30s.
        run: node extensions/main-worktree-guard/test-module-load.mjs
      - name: main-worktree-guard working-tree-discard gate (#709)
        # The discard family used to be gated on git ARGV, so `git checkout --
        # <path>` (the 2026-09-10 incident verb) classified `allow` and every
        # other discard verb was exempt in linked worktrees — exactly where the
        # `pi -p` review fixers run. #709 keys the gate on the EFFECT instead.
        # Behavioral: loads the REAL index.ts through module-load-hooks.mjs and
        # drives the tool_call handler against a hermetic hub + linked worktree.
        # Zero-dep (`node:*` + the `git` binary), no `npm ci`, ~5s. Its own
        # step (the post-merge `extensions/*/test*.mjs` glob in ci-main.yml is
        # not PR-triggered); perf-parity with the #744 step above.
        run: node extensions/main-worktree-guard/test-discard-gate.mjs
      - name: main-worktree-guard discard-gate MUTATION evidence (#2161)
        # #2161 closed a fail-OPEN hole: an escaped quote inside an ANSI-C
        # `$'…'` word closed the word early, phantom-quoted the rest of the
        # script, and the M5 walk reported ZERO discards. That is a DETECTION
        # defect — a suite that only asserted "a discard is found" would keep
        # passing while the hole reopened, so the pin has to be able to go RED.
        # `--mutations` reintroduces the defect into a TEMP copy of
        # classify-git.mjs, imports that copy, and requires the paired pinned
        # case to go BLIND; a mutation whose pin still passes is a suite
        # failure. Same construction as the fleet-liveness `--mutations` step
        # above (an unwired suite is inert by never running).
        # Zero-dep (`node:*` + the `git` binary), no `npm ci`, ~10s. Its OWN step,
        # not a flag on the step above: a `&`/flag chain would let one verdict
        # suppress the other (the rule every suite in this job follows).
        run: node extensions/main-worktree-guard/test-discard-gate.mjs --mutations
      - name: main-worktree-guard script-content backdoor gate (#1484, false positives #1485)
        # #1484 gated the CONTENT of every executed path, so (a) a COMPILED
        # EXECUTABLE was read as a script — `/Users/…/bin/gh` is a Go binary whose
        # bytes contain the word `git`, which refused EVERY `gh issue list`/`api`/
        # `pr list` — and (b) a COMMITTED repo script was gated on the operation it
        # implements, so this repo's own `scripts/admin-merge.sh` could not be run
        # from the hub. #1485 exempts opaque executables and committed repo
        # scripts, and this suite pins BOTH that the two false positives are gone
        # and that the #1484 threat (a fresh script written then executed against
        # the shared main checkout) is still refused — the relaxation must not be
        # a hole. Behavioral: loads the REAL index.ts through module-load-hooks.mjs
        # and drives the tool_call handler against a hermetic hub.
        # Zero-dep (`node:*` + the `git` binary), no `npm ci`, ~5s. Its own step
        # (like #709/#744 above) because the `extensions/*/test*.mjs` glob in
        # ci-main.yml is POST-MERGE only, and a fail-open regression in a guard
        # must not reach main before anything reads it.
        run: node extensions/main-worktree-guard/test-script-backdoor.mjs
      - name: main-worktree-guard sanctioned-script IDENTITY + pin (#2332)
        # The exemption for `SANCTIONED_SCRIPT_RELPATHS` was a realpath STRING
        # EQUALITY against the module's own checkout, which is only correct where
        # the guard and the scripts live in ONE tree. On a copy-deployed box the
        # module root is `~/.pi/agent` (partial `scripts/`, no `admin-merge.sh`
        # at all, #2176) while the rail lives in `$AGENT_INFRA_PATH/scripts/` —
        # so the mandated merge rail was REFUSED from every hub-rooted session
        # and the only routes left were the hatch or a bare `gh pr merge` that
        # skips every comparison the rail makes. This suite pins the two halves
        # that make the widened exemption safe — sanctioned relpath INSIDE a
        # framework checkout, sha256 equal to the pin, AND the audited DELEGATION
        # CLOSURE (every `$SELF_DIR` helper the script executes) — and MUTATES the
        # shipped source to prove each part is load-bearing (literal-path equality
        # restored ⇒ the rail blocks again; leaf digest dropped ⇒ a renamed
        # destructive script is allowed; root check dropped ⇒ a non-framework dir
        # is exempted; closure dropped ⇒ the pinned rail runs an agent-chosen
        # `ci_exemption.py`, its own grader). It is a PIN-FRESHNESS gate
        # too: a PR that changes (or deletes) a listed script — or a helper one of
        # them executes by its own location — without re-cutting
        # `sanctioned-scripts.pin.json` reds here, so a stale pin cannot reach
        # main and silently block the rail.
        #
        # ⛔ #2818 — `--ref` is the whole fix for the treadmill. Without it the
        # gate reads the pin and the scripts out of the SAME CHECKOUT, which here
        # is GitHub's synthetic MERGE of head onto the base TIP: a merge result
        # takes each file from whichever side changed it, so a branch that re-cut
        # its pin beside ITS OWN sanctioned-script edit carried that pin next to
        # scripts an unrelated merge had since changed — red until someone re-cut,
        # and every new merge re-opened it on every other open PR. Naming the head
        # commit answers the question the gate exists to answer ("did THIS change
        # drift the sanctioned surface without re-cutting?"), which no unrelated
        # merge can invalidate. The polarity is unchanged and is pinned by
        # `test-sanctioned-pin-merge-base.mjs`: untouched surface ⇒ pass however
        # far main moved; edited surface without a re-cut ⇒ fail; edited +
        # re-cut ⇒ pass.
        # Zero-dep (`node:*` + the `git` binary), no `npm ci`, ~3s. Its own step
        # for the same reason as the suite above: the `extensions/*/test*.mjs`
        # glob in ci-main.yml is POST-MERGE only.
        run: node extensions/main-worktree-guard/test-sanctioned-identity.mjs --ref "${{ github.event.pull_request.head.sha }}"
      - name: main-worktree-guard pin freshness is a property of ONE commit (#2818)
        # The non-vacuity rig for the line above. Hermetic git repos build the
        # treadmill: a branch re-cuts its pin beside its OWN sanctioned-script
        # edit, an unrelated merge moves another sanctioned script on `main`, and
        # the merge GitHub would build then carries the branch's pin beside main's
        # scripts. Asserts (a) the change PASSES judged on its own commit; (a′)
        # the SAME change FAILS judged on the merged tree — the pre-#2818 reading,
        # so dropping `--ref` reds this suite instead of silently restoring the
        # treadmill; (b) an edit without a re-cut still FAILS; (b′) a deletion
        # without one still FAILS; (c) edit + re-cut PASSES, base moved or not.
        # It also asserts this wiring (`--ref`, `fetch-depth: 2`, this step),
        # because an unwired suite passes by never running.
        # Zero-dep (`node:*` + the `git` binary), ~2s.
        run: node extensions/main-worktree-guard/test-sanctioned-pin-merge-base.mjs
      - name: main-worktree-guard nested-worktree hub gate (#1919)
        # `git worktree add 8779-optA` (a RELATIVE path) puts a registered
        # worktree INSIDE the repo root; git reports it as an untracked
        # directory, so the hub read DIRTY forever and the M4 hub-state gate
        # refused every verb that could move it out (a gate closed against its
        # own repair). This suite pins BOTH halves: a registered worktree is not
        # hub dirt, AND a genuine untracked file / tracked modification still is
        # — plus the creation refusal for an unignored target inside a checkout.
        # Behavioral: loads the REAL index.ts through module-load-hooks.mjs and
        # drives the tool_call handler against a hermetic hub. Zero-dep
        # (`node:*` + the `git` binary), no `npm ci`, ~3s. Its own step (the
        # post-merge `extensions/*/test*.mjs` glob in ci-main.yml is not
        # PR-triggered).
        run: node extensions/main-worktree-guard/test-nested-worktree.mjs
      - name: task-cwd-guard shared-main spawn-cwd gate (#1240)
        # A `task` dispatch with no explicit `cwd` inherits the PARENT's cwd
        # (#1071), so ~124 dispatches/hour on the tortoise hub landed in a
        # SHARED MAIN checkout — where one lane's unpushed commit gates git
        # writes for every session rooted there. The gate resolves the child's
        # target and refuses a shared main checkout, naming the worktree remedy.
        # Behavioral: loads the REAL index.ts through loader-hooks.mjs and drives
        # the tool_call handler against a hermetic hub + NESTED linked worktree
        # (a path-prefix gate would false-positive on the nested worktree, which
        # is exactly what B5/B6 pin). Zero-dep (`node:*` + the `git` binary), no
        # `npm ci`, ~3s. Its own step (the post-merge `extensions/*/test*.mjs`
        # glob in ci-main.yml is not PR-triggered).
        run: node extensions/task-cwd-guard/test-cwd-guard.mjs
      - name: entry-point guard symlink regression (#708)
        # The entry-point idiom `pathToFileURL(process.argv[1]).href ===
        # import.meta.url` is symlink-SENSITIVE (pathToFileURL does no fs
        # resolution; the ESM loader realpaths import.meta.url), so ANY
        # symlinked invocation path made the guard body skip and the #254
        # fail-closed frontmatter gate exit 0 having printed NOTHING —
        # indistinguishable from a clean run. macOS `mktemp -d` is under `/var`
        # and every bootstrapped consumer repo symlinks `scripts/` (#387), so
        # this is the normal case, not an edge case.
        # Its own step (like #744/#709 above) because the
        # `extensions/*/test*.mjs` glob in ci-main.yml is POST-MERGE only.
        # Positive control: spawns the REAL gates through symlinked paths.
        # Zero-dep (`node:*` only), no `npm ci`, ~3s.
        run: node extensions/shared/test-is-main.mjs
      - name: infra-verify bounded-scan regression (#1051)
        # `find <dir>/` dereferences a symlinked START POINT and `-P` cannot undo
        # it, so a repo committing `templates -> /` turned infra-verify's bounded
        # in-checkout enumeration into a filesystem-wide walk that could report
        # green over a tree that is not the checkout's. Its own step (like
        # #708/#744/#709 above) because the `extensions/*/test*.mjs` glob in
        # ci-main.yml is POST-MERGE only, and a fail-open regression in a
        # verifier should not reach main before anything reads it.
        # Hermetic (temp fixtures, a tiny sentinel tree — never `/`), zero-dep
        # (`node:*` + bash), no `npm ci`, ~2s. The suite is bidirectional: the
        # vulnerable form (`find <dir>/`, `find -H`, `find -L`) is executed and
        # asserted to LEAK, then the fixed form is asserted not to.
        run: node extensions/shared/test-infra-verify-scan.mjs
      - name: read-path failure contract — tortoise-memory.mjs (tortoise#3805 / #1182)
        # The skills' memory client used to exit 0 in every direction (never
        # configured, unreachable, and a genuinely empty store were ONE
        # observable) and defaulted its base URL to the DASHBOARD host while the
        # API lives on api.premiselabs.co.
        # Its own step (like #744/#708/#709/#1051 above): the `test-command`
        # accumulator is exact-pinned by check-pi-pin-lockstep.mjs (guard (j)), so
        # a new suite cannot be appended there; and ci-main.yml has NO
        # `scripts/*.test.mjs` glob (it names the older scripts suites
        # explicitly), so a new one is not auto-collected post-merge either.
        # The suite EXECUTES the real client as a subprocess against a local HTTP
        # stub (a source-text scan is a false PASS) and pins both directions:
        # RED on the defect, GREEN under a behaviour-identical reformat. Zero-dep
        # (`node:*` only), no `npm ci`, ~4s.
        run: node --test scripts/tortoise-memory.test.mjs
      - name: version-stamp drift check — scripts/check-version-stamp.test.mjs (#1760)
        # A check nothing runs is the inert gate #1760 exists to remove, so its suite is wired here.
        # The SUITE is wired rather than the checker: the suite builds its own git fixtures (a real
        # repo, a stamped surface, an off-main-line branch), so it is independent of whether the
        # runner's surface set is stamped — while the checker itself, with no surfaces present,
        # deliberately refuses (exit 2, "an empty set is not a pass") rather than reporting green.
        # That refusal is the behaviour, so wiring the checker here would be red for the wrong reason.
        # Zero-dep (`node:*` only), no `npm ci`.
        run: node --test scripts/check-version-stamp.test.mjs
      - name: cmux-session snapshot pin — extensions/cmux-session.test.ts (#1138)
        # Same shape as the step above, one layer down: a suite that pins a
        # version-controlled snapshot, wired nowhere, so it enforced nothing.
        # extensions/cmux-session.ts is a bootstrap SNAPSHOT of a file cmux
        # upgrades IN PLACE on the farm (~/.pi/agent/extensions/cmux-session.ts),
        # so the snapshot can silently fall behind with nothing in main saying so
        # — measured: main carried the v2 snapshot (55,408 B) while the farm ran
        # v4 (74,220 B, sha256 35764c49…), and that delta was in no ref at all.
        # HONEST SCOPE: the literals live in the same commit as the file, so this
        # cannot observe the FARM advancing — cmux upgrading the live file leaves
        # this repo holding the previous payload with a green suite. What it
        # catches is an unrecorded swap of the committed snapshot (the v2-in-main
        # shape #1138 describes). The farm-advance residual is named on #1138.
        # The step is what makes the pins BITE. Against the old v2 blob THREE
        # tests fail (the handler test — v2 registers no `agent_start` — plus both
        # pins; 1 passed, 3 failed, exit 1); against a v4 payload carrying a
        # line-1-preserving edit the payload assertion alone goes red (3 passed,
        # 1 failed, exit 1) — the false PASS a marker literal cannot see, which is
        # #1760's payload-hash decision applied to this snapshot.
        # Zero-dep by construction (the pi package is a TYPE-only import, erased
        # by tsx; node stdlib otherwise), so it runs in THIS job, which performs
        # no `npm ci`.
        run: npx tsx extensions/cmux-session.test.ts
      - name: Shared tool-call predicate (#1330, zero-dep half)
        # #1330 — pi's `isToolCallEventType` was copied PRIVATELY into each extension
        # that needed it (skill-enforcer, sequence-enforcer, and the two test-side
        # SDK stubs). A copy of an SDK function has no pin unless someone writes
        # one: an upgrade that moved the tool name would make the copy return
        # `false` for EVERY event, so the gate branches are never reached and the
        # extension keeps printing `✅ Loaded — enforcing N skill gates` with every
        # gate inert — an enforcer reporting success while enforcing nothing.
        #
        # This is the ZERO-DEP half: the copy's own semantics (including the
        # malformed-event case, where upstream THROWS and the old copy's
        # `event?.toolName` silently returned false) plus the SINGLE-HOME scan —
        # exactly one definition under extensions/, the consumers importing it, and
        # the two loader-hook SDK stubs re-exporting it rather than re-declaring it.
        # The SDK-BEARING half (agreement with the real export) is the
        # `pi-sdk-parity` job below: it cannot run here, because THIS job performs
        # no `npm ci` — which is the reason the copy exists at all.
        # Zero-dep (`node:*` only), no `npm ci`, ~1s. VISIBLE, not merge-blocking
        # (`pipeline-compliance` is the repo's only required check, #646); the
        # BLOCKING backstop is the post-merge ci-main.yml `extensions/shared/*.test.ts`
        # glob, which collects this file automatically.
        run: npx tsx extensions/shared/tool-call-event.test.ts
      - name: Literal-path fence (no swarm abspath in skills/extensions/scripts)
        # Task 4 acceptance, CI-enforced: FAIL on a match. docs/ is excluded
        # (provenance).
        run: '! grep -rE ''/Users/danielospina/swarm/operations/coordination'' skills/ extensions/ scripts/'

  http-pool-hygiene:
    # #1110 — the real-transport arms of this suite (the dead-socket RED
    # baseline and the keepAliveMaxTimeout falsifier) need a real undici copy.
    # The zero-dep `verify` job has none, so the glob in ci-main.yml SKIPPED
    # them and exited 0 — a green run that tested nothing (inert gate).
    # Install pi's pinned undici (8.9.0, the version the vendored pin carries)
    # into a TEMP COPY of the extension and run from there — no NODE_PATH, which
    # would leak into `require.resolve` and turn Part 5's "unresolvable" negative
    # case into a false failure. PI_HTTP_POOL_REQUIRE_UNDICI=1 makes a missing
    # undici a FAILURE instead of a green skip. Test-only: no repo manifest is
    # touched and nothing is written under the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install undici for the real-transport arms (test-only)
        run: |
          tmp="$RUNNER_TEMP/pool-hygiene-ext"
          mkdir -p "$tmp"
          cp -R extensions/http-pool-hygiene/. "$tmp/"
          npm install --no-save --no-audit --no-fund --prefix "$tmp" undici@8.9.0
      - name: http-pool-hygiene suite (real transport REQUIRED)
        run: PI_HTTP_POOL_REQUIRE_UNDICI=1 node "$RUNNER_TEMP/pool-hygiene-ext/test-pool-hygiene.mjs"

  pi-sdk-parity:
    # #1330 — the SDK-BEARING half of the shared tool-call predicate pin.
    #
    # WHAT IT PINS: extensions/shared/tool-call-event.ts (the repo's ONE copy of
    # pi's `isToolCallEventType`) must agree with the REAL export installed from
    # the locked @earendil-works/pi-coding-agent devDependency — on the return
    # value AND on thrown-ness, over a matrix of event shapes including the
    # relocated-name shapes an upgrade would produce.
    #
    # WHY ITS OWN JOB: this needs the SDK installed. `verify` performs no `npm ci`
    # BY DESIGN and each of its steps asserts that property (the zero-dep gate
    # suites are exactly what the copy exists for), so installing the SDK there
    # would retire the property for the suites that rely on it. Same reason
    # `http-pool-hygiene` is a job. The zero-dep half of this pin
    # (extensions/shared/tool-call-event.test.ts) runs in `verify`.
    #
    # WHY PER-PR, NOT ci-main ONLY: the drift arrives with the PR that bumps
    # PI_VERSION_PIN (scripts/check-pi-pin-lockstep.mjs forces the pins to move in
    # lockstep) or with a PR that edits the copy. A suite wired only into
    # ci-main.yml reports that on main AFTER the merge — the #1250 shape.
    #
    # NO NEW VERSION LITERAL: the install takes the pin from
    # extensions/verification-gate/package.json, which guard (h) of
    # scripts/check-pi-pin-lockstep.mjs already holds equal to PI_VERSION_PIN.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned pi SDK (test-only)
        # The parity suite is SDK-bearing by construction; the pin it asserts is
        # the locked devDependency of the directory it lives in. `--prefix` rather
        # than a `cd` subshell so the command does not change the step's cwd for
        # anything after it.
        run: npm ci --prefix extensions/verification-gate --no-audit --no-fund --loglevel=error
      - name: Shared-predicate parity pin (#1330)
        run: npx tsx extensions/verification-gate/tool-call-event-parity.test.ts

  # ⛔ NO `setup-suite` JOB (agent-infra#2439). Its one step was
  # `pi-bootstrap/tests/test-setup-no-nesting.sh`, which is ALREADY a shard of
  # `scripts/run-bash-shards.sh` — so this job re-ran it on every PR push (17 s of
  # the 23 s job was the suite itself). The #449 rationale stands and is cited on
  # that shard line; only the second run site is gone.

  bash-suites:
    # #1369 — Route A of the lane-split fix: the PR lane must RUN the bash work its check
    # name implies. Before this job, `ci / script-validate` ran `node --check` only (~4s)
    # while main's `script-validate` ran the bash sweeps + the hermetic suites (~5m20s)
    # — one check name over two different bodies of work. A runner-only failure therefore
    # reached main with a GREEN PR: scripts/record-review.test.sh exited 127 on the ubuntu
    # runner (its PATH-shim vector) and reddened main (#1348 → #1369).
    #
    # BOTH lanes call `scripts/run-bash-shards.sh`, which IS the shard list. The first repair
    # duplicated the list into each workflow and compared the two; two independent reviews
    # then showed every text form that reads as coverage without executing (a shard named in
    # a heredoc body, an `env:` value, after `true ||`, on a `for f in a.sh …` continuation
    # line, or as `env bash x.sh`). Comparing two hand-kept lists cannot be made sound — so
    # there is now ONE list, and drift between the lanes is impossible by construction.
    #
    # scripts/check-ci-lane-parity.sh asserts the narrow residue: each lane calls the runner,
    # and the runner is not gutted (vacuity floors). tests/ci-lane-parity/run.sh exercises
    # those arms with mutations.
    #
    # NOT a required check: the repo's only required status is `pipeline-compliance` (#646
    # records code CI as advisory). Making this required is a REOPEN of that decision with
    # evidence, never a quiet branch-protection edit.
    #
    # `bash-suites` deliberately does NOT begin with the admin-merge rail's parity prefix
    # (`ADMIN_MERGE_LANE_JOB_PREFIX`, default `test`), so it stays outside that family and
    # cannot move the rail's lane-coverage comparison (#1349 — a separate remedy; nothing
    # here helps or hinders it).
    #
    # ⛔ DURATION, not runner capacity, was this job's defect (measured 2026-10-23, PR #2412):
    # the run started 10:25:04Z, was still `in_progress` at 13:11Z — ~2h46m inside the ONE step
    # "Bash shards — the ONE list both lanes run" — and then failed. Measured alongside that:
    # 80 open PRs, and the account pool was NOT starved (agent-infra: 5 in progress / 3 queued
    # against a 20-job pool). One unsharded job holding a serial sweep for hours starves CI by
    # DURATION while every capacity signal reads healthy. Two defects, and the second is why the
    # first was invisible:
    #   1. every shard ran SERIALLY in one job → the fix is the MATRIX below.
    #   2. the job declared NO `timeout-minutes` (agent-infra #2055) → a hung shard burned hours
    #      and then reddened the PR without naming itself. The bound below makes a hang FAIL FAST,
    #      and the job that trips it names the slice it was running.
    #
    # ⛔ THE MATRIX CARRIES A SLICE, NEVER A LIST. `scripts/run-bash-shards.sh` remains the ONE
    # source of the shard list (its header records why every duplicated-list form was proven
    # unsound). This job contributes only a LANE WIDTH, and even that is not typed twice: the
    # denominator is `strategy.job-total`, GitHub's own count of the jobs this matrix expands to,
    # so widening or narrowing the matrix below is a ONE-LINE edit that cannot leave a stale `/N`
    # behind. The slice arrives as `BASH_SHARD_SLICE` in the STEP's `env` — not as an argument —
    # because the step's `run` must stay the bare call `bash scripts/run-bash-shards.sh`: that is
    # what `check-ci-lane-parity` asserts (an argument there is a MENTION, not the call, and the
    # lane un-wires — the #1369 class).
    #
    # COVERAGE IS ARITHMETIC, NOT TRUST. Each slice asserts that the SET of shards it executed is
    # exactly the set its index derives from the list (a sorted-path comparison, not a count — a
    # broken modulus that runs the right NUMBER of the wrong shards is caught too), AND that
    # `executed + skipped == listed`. The slices therefore sum to the whole list. A slice that runs
    # nothing, or a neighbour's shards twice, fails its own assertion rather than reporting a green
    # check over a hole.
    runs-on: ubuntu-latest
    # #2055: a bound, so a hang fails fast and the failing job NAMES its slice. Sized from CI's own
    # measurements (PR #2412 job 120365087427: the list then held 74 shards — it is 78 today, and
    # the per-slice sizes are DERIVED, so no number here goes stale — 73.6 min, 59.7 s/shard
    # mean; #2483's
    # main-lane profile: tests/atomic-land/run.sh 32m51s, tests/admin-merge/run.sh 16m37s, the
    # remaining shards 26m25s).
    #
    # ⛔ THE FLOOR IS THE SINGLE SLOWEST SHARD, NOT THE SLICE COUNT. `tests/atomic-land/run.sh` is
    # ~33 min ON ITS OWN (66 serial mutation re-runs, each <81 s — which is why a gap analysis over
    # the log cannot see it), so with 8 round-robin slices the worst slice is ≈ 33 min + its 9
    # siblings ≈ 37 min, and no wider matrix goes below 33. The shard step's own bound below is 70
    # min = ~1.9x that slice: enough for runner variance, and it still fails fast against the
    # unbounded 1h52m this job shipped with.
    # Splitting those two shards is #2483 — until it lands, slicing halves the wall (73.6 → ~37 min
    # of shard work) and nothing can make it shorter.
    #
    # ⛔ THIS JOB BOUND IS A PURE BACKSTOP, AND THE INVARIANT IS ARITHMETIC: it sits ABOVE the sum
    # of its steps' bounds, so it can never fire before the step that is actually running trips its
    # OWN bound. That matters because the two produce different conclusions — a step trip is
    # `failure` (RED), a job trip is `cancelled`, which this repo's merge rail names NON-RED. A job
    # bound below the sum would let the non-red one win: 10 (checkout) + 10 (node) + 70 (shards) =
    # 90 < 100.
    timeout-minutes: 100
    strategy:
      # false: every slice reports its own result, so one hang cannot hide the other slices'
      # verdicts — the diagnostic this job lacked, since a single step reported nothing until
      # it died.
      fail-fast: false
      matrix:
        # Slices, not shards. Width = the number of entries here; the per-slice sizes are DERIVED by
        # the runner's own round-robin (`pos % n`) over whatever the list holds today, not asserted
        # here — they shift when a `run_shard` line is added, and the runner re-derives them, so
        # nothing in this file goes stale. The runner refuses a count wider than its own list.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # ⛔ checkout and setup-node carry their own bounds too. Unbounded, a hang in EITHER would be
      # caught by the JOB bound above — i.e. reported `cancelled`, which the rail reads as NON-RED,
      # while no shard had run: every shard ungated behind a non-red check, which is worse than
      # losing one slice. `timeout-minutes` applies to `uses:` steps as well as `run:` steps (the
      # runner sets the step deadline before `step.RunAsync()` for either kind).
      - uses: actions/checkout@v4
        timeout-minutes: 10
      # The runner below includes `tests/search-cost/run.sh`, whose harness type-strips index.ts and
      # needs Node >= 22.13 — ci.yml's own `search-cost` job pins it for exactly this reason, with the
      # note that inheriting the runner's Node "is not a contract". Same pin here, and the same pin in
      # ci-main.yml's `script-validate`: one runtime for the list, in both lanes.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
        timeout-minutes: 10
      - name: Bash shards — the ONE list both lanes run (#1369)
        # <index>/<count>; count = strategy.job-total (this matrix's own size — never a second
        # hand-kept number, and never a list: the list is the runner's).
        env:
          BASH_SHARD_SLICE: ${{ matrix.shard }}/${{ strategy.job-total }}
        # ⛔ THE BOUND IS ON THE STEP, NOT ONLY ON THE JOB — the two are DIFFERENT conclusions, and
        # only one of them blocks. A JOB that trips `jobs.<id>.timeout-minutes` is reported
        # `cancelled`: the service cancels the job, the job-cancellation callback sets
        # `jobContext.Result = TaskResult.Canceled` (`StepsRunner.cs:149-155`, the `Canceled` arm at
        # :154), and a step still running when that happens takes `TaskResult.Canceled`
        # (`StepsRunner.cs:331-336`). (`JobRunner.cs` has NO timeout handling at all — its
        # `TaskResult.Canceled` at :198 is the *initialize* cancel path, not this one.)
        # A `cancelled` check is NON-RED to this repo's rail (`scripts/admin-merge.sh`
        # `NON_RED_CONC`), so a job-only bound would let a PR merge with THIS slice's shards never
        # executed — a false PASS dressed as a fail-fast, which is the #1369 shape one level up.
        # A STEP that trips its own bound takes the other branch in the same file: at
        # `StepsRunner.cs:324-329`, `timeoutMinutes` fires with `jobCancellationToken` NOT
        # cancelled, so the result is `TaskResult.Failed` — which the job reports as `failure`,
        # which the rail reds. 70 min leaves 20 min of job bound for checkout/setup and stays ~1.9x
        # the measured worst slice (~37 min), so it cannot false-block a slow-but-healthy slice.
        timeout-minutes: 70
        run: bash scripts/run-bash-shards.sh

  bash-suites-gate:
    # #1369's two guard steps, ONCE per PR — not once per slice. They lived in `bash-suites`
    # while it was a single job; inside a MATRIX they would run 8 times, and
    # `tests/ci-lane-parity/run.sh` executes, once per runtime pin, a fixture built from the
    # runner's own lines with every `run_shard <path>` line rewritten to the hermetic
    # `tests/ci-lane-parity/stand-in-shard.sh` (there is no `runner-fast.sh` any more — #2529
    # removed it; the quoted `run_shard "$sentinel"` call survives the rewrite by design, so the
    # failure-recording arm still has something to fail). It costs ~8 s today, but it is a whole
    # suite per slice: running it 8 times would buy nothing and would re-create this PR's own
    # defect in the job that exists to catch it.
    #
    # ⛔ NOT conditional and no `needs:` — `check-ci-lane-parity` refuses `if`/`needs`/
    # `continue-on-error` on the call-carrying job exactly so a lane cannot be made to look wired
    # while it never runs. This job is a plain sibling: it runs on every PR, and its failure reds
    # the PR like any other. `bash-suites` still makes the bare call the guard asserts.
    runs-on: ubuntu-latest
    # #2055: the bound this job never had. ⛔ THE BOUND IS SIZED FROM THE CURRENT SUITE, NOT FROM
    # THE 38m41s FIGURE THIS COMMENT USED TO CARRY — that measurement is PR #2412's (job
    # 120365087427, 2026-10-23T10:25Z), and it predates #2529 (`00814821`, 16:09Z the same day),
    # which stopped the suite's fixture re-running the real shard list and replaced it with one
    # hermetic stand-in. MEASURED AFTER #2529 (2026-10-24, `bash-suites-gate` step 5, 17 PR runs
    # sampled from the Actions API): 6-12 s on 16 of them (3x6, 1x7, 8x8, 2x9, 2x12 s) and one
    # 17 s outlier — the ~90 static arms, not the shard list, are the wall now. The stale figure
    # outlived its cause by a day and was read as "the one confirmed per-PR cost left"; a bound
    # derived from it protects nothing while it looks sized.
    #
    # 15 min ≈ 53x the worst observed 17 s: a bound BELOW the real run would false-block every PR
    # (a red that is not a defect is how a gate loses its authority), while a bound 400x above it
    # is not a fail-fast — it is the #2055 stall with a label on it.
    #
    # ⛔ SAME ARITHMETIC AS `bash-suites`: the job bound sits ABOVE the sum of the step bounds below
    # (10 + 10 + 5 + 15 = 40 < 60), so a running step always trips its OWN bound first — which is
    # `failure` (red), never the job-level `cancelled` this repo's rail reads as non-red.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
        timeout-minutes: 10
      - name: Lane parity — both lanes must call the one bash-shard runner (#1369)
        # Step bounds, not just the job bound, for the reason recorded on `bash-suites` above: a
        # step timeout is `failed` (red), a job timeout is `cancelled` (non-red to the rail).
        # The guard itself is a single node run — 0.3-0.4 s locally, ≤1 s on the runner.
        timeout-minutes: 5
        run: bash scripts/check-ci-lane-parity.sh
      - name: Lane-parity guard self-test — mutations, not just "it runs" (#1369)
        # 15 min for a suite measured at 6-17 s on PR runs since #2529 — see the bound's
        # arithmetic in this job's header.
        timeout-minutes: 15
        run: bash tests/ci-lane-parity/run.sh

  vendor-drift:
    # #383 — the SINGLE vendor drift gate: bash syntax + manifest verification
    # (identical@base sha256s + ledger patches reverse-apply to the swarm base).
    # Isolated as its own job so drift failures get their own red signal,
    # decoupled from the pytest/tsx suite. Verifies against the pinned
    # base_rev in scripts/.vendor-manifest.json; the private swarm checkout
    # (default branch, full history — the rev sits on main's history) provides
    # the base anchor. Requires AGENT_INFRA_READ_TOKEN (read access to
    # daniel-ospina/swarm) — the same cross-repo pattern as drift-check.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: daniel-ospina/swarm
          fetch-depth: 0
          path: swarm
          token: ${{ secrets.AGENT_INFRA_READ_TOKEN || github.token }}
      - name: Bash syntax check (vendored scripts + drift gate)
        run: bash -n scripts/checkout_guard.sh scripts/parallel_work_check.sh scripts/check-vendor-drift.sh
      - name: Vendor drift gate (manifest)
        env:
          SWARM_ROOT: ${{ github.workspace }}/swarm
        run: scripts/check-vendor-drift.sh --manifest
