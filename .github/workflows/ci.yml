name: CI
# Thin caller (#303) — delegates to the reusable node-ci workflow in
# agent-infra. Self-caller keeps @main (locked decision D2: same-commit,
# no tag-before-merge problem); consumers pin @vX.Y.Z instead.
# Budget: PR-only (shared Actions budget under daniel-ospina account)

on:
  pull_request:

# #637 — the per-PR pin gate below adds one runner per PR; cancel superseded
# runs so rapid pushes don't queue (ci.yml header budget note).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # node-ci.yml is a real committed file (materialized via
    # scripts/sync-ci-workflows.sh). #306 merged — main carries the real file,
    # so the self-caller is back on @main (locked decision D2: same-commit,
    # no tag-before-merge problem).
    uses: daniel-ospina/agent-infra/.github/workflows/node-ci.yml@main
    secrets: inherit
    with:
      # #637 — the pin-lockstep tripwires ((h) pin lockstep, (i) mirror
      # version stamps, (j) this wiring) were enforced only by the post-merge
      # ci-main.yml leg, so a partial pin bump — PI_VERSION_PIN moved, one
      # extensions/*/package.json pin missed — would have merged before any gate
      # read it. Run the suites per-PR so pin drift reports on the PR that
      # introduces it. Both suites are node-stdlib-only (no npm ci, no extension
      # devDeps): ~4s of work plus one ubuntu-latest runner per PR.
      # #666 split the pin guards into their own suite (scripts/
      # check-pi-pin-lockstep.mjs). HONEST SCOPE (#675 P2-2): the split does NOT
      # create a separate check context — both suites still share the one
      # `ci / unit-test` signal, and the two failure modes are distinguishable in
      # that job's LOG only (a separate context is issue #673). A single `with:`
      # input (`test-command`) is what keeps the `with:` key set at exactly one,
      # which guard (j) asserts along with this exact command string.
      # The accumulator below (not `&&`) is deliberate: `&&` short-circuits, so a
      # #254 frontmatter-validator failure would skip the pin suite entirely and
      # its verdict would never be produced for that PR. The `|| … || …` form
      # (rather than `cmd; a=$?;`) is required because the runner's default Linux
      # shell is `bash -e {0}`: under `set -e` a bare failing `node` aborts the
      # script before `a=$?` runs, reintroducing the short-circuit. Both suites
      # always run; the step still fails if either did.
      # NOTE: this makes the checks CI-VISIBLE on every PR, not merge-blocking —
      # the repo's only required status check is pipeline-compliance (#646).
      # ⚠️ This value is PINNED by check-pi-pin-lockstep.mjs (guard (j)): it must
      # be EXACTLY this invocation — a suffix or shell wrapper fails the pin
      # gate. The #744 module-load suite therefore runs as its own step in the
      # `verify` job below, not here.
      test-command: a=0; node scripts/check-skill-lint.test.mjs || a=$?; b=0; node scripts/check-pi-pin-lockstep.mjs || b=$?; [ $a -eq 0 ] && [ $b -eq 0 ]

  drift-check:
    # #305 — self-test of the drift-check CI gate. agent-infra's own checkout
    # is never bootstrapped (no committed AGENTS.md/.mcp.json/.husky pin — it's
    # the source), so this runs the fixture-based test suite: tiered exit codes
    # (structural fail / content warn / clean), stale-pin regression, and the
    # drift-check.yml YAML validity.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drift-check tests (tiered exits, fixtures, workflow YAML)
        run: bash tests/drift/run.sh

  cost-config:
    # #341 — cost-config drift guard (config clamp @400K): asserts the shipped
    # deepseek context clamp + settings compaction/retry contract, then runs
    # the fixture suite (backdoor drift blocks/warns, clean 400K passes,
    # override honored). Shipped-only — CI has no live ~/.pi/agent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cost-config guard (shipped, --shipped-only)
        run: bash scripts/check-cost-config.sh --shipped-only
      - name: Cost-config guard tests (fixtures, detect-not-block semantics)
        run: bash tests/cost-config/run.sh

  pi-config-extensions:
    # #498/#502 — pi-config extension-farm parity gate (issue #95 invariant):
    # every extensions/ top-level entry except *.test.ts must be farm-wired
    # into pi-bootstrap/pi-config/extensions (single source of truth — a new
    # extension that isn't wired ships on NO machine) AND listed in manifest.json
    # files.extensions.entries (the consumer ship-list — a tree entry with no
    # manifest row ships on NO consumer, #498 staleness class). Repo-tree only,
    # no live ~/.pi/agent dependency, then the runtime-fixture suite exercising
    # checks 1–4 (materialized copy / mistargeted link / unwired entry /
    # manifest↔tree row drift) + the *.test.ts exclusion.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extension-farm parity gate (symlink farm + manifest.json into extensions/)
        run: bash scripts/check-pi-config-extensions.sh
      - name: Extension-farm parity gate tests (fixtures, checks 1-4)
        run: bash tests/pi-config-extensions/run.sh

  actionlint:
    # #398 — workflow YAML syntax + Actions-expression errors fail CI BEFORE
    # merge (the #394 defect class: a literal '${{' in a plain YAML scalar
    # description broke the expression lexer → whole workflow failed at
    # validation with 'workflow file issue', zero jobs, zero logs; only the
    # post-merge backstop caught it). Zero-new-deps: official rhysd/actionlint
    # docker image (pinned 1.7.12); scope = syntax + expression only
    # (-shellcheck=: pre-existing style-level shellcheck findings on clean
    # main must not trip the gate).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actionlint gate (workflows + templates)
        run: bash scripts/check-workflow-actionlint.sh
      - name: Actionlint gate tests (fixtures, #394 regression)
        run: bash tests/actionlint/run.sh

  verify:
    # #383 — vendored parallel_work_check pytest suite (self-contained) +
    # sequence-enforcer tsx suite (incl. the joint checker→enforcer token-shape
    # test) + the Task 4 literal-path fence (machine-checked, not manual).
    # Self-contained per-PR: no dependency on post-merge python-ci or the
    # private swarm checkout. ONE canonical interpreter (3.12) across the
    # Task 1 local env, this job, and ci-main's python-ci caller — a
    # 3.11/3.12 divergence would pass PR CI and only break post-merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest + pytest-timeout + pyyaml
        # pyyaml: the sequence-enforcer's loadSteps frontmatter fallback runs
        # `python3 -c 'import yaml'` — the CI runner's python3 has no PyYAML by
        # default (local macOS python3 does), which fails the token_phase +
        # F2 activation tests (loadSteps returns null → no steps parsed).
        run: pip install pytest pytest-timeout pyyaml
      - name: Vendored parallel_work_check suite (pytest, B1–B34)
        run: python3.12 -m pytest scripts/test_parallel_work_check.py -x --timeout=60 -q
      - name: Sequence-enforcer suite (incl. joint checker→enforcer test)
        run: npx tsx extensions/sequence-enforcer/sequence-enforcer.test.ts
      - name: Merge-scope subtraction suite (#755, SDK-free)
        # #755 — zero-dependency by construction: subtract-scope.test.ts imports
        # ./index.js as a TYPE only (erased by tsx) and drives real git in temp
        # repos. It MUST run here, in the job that performs no `npm ci` — that is
        # exactly the property being pinned. The parser row-family pins live in
        # index.test.ts instead, which DOES need the SDK.
        run: npx tsx extensions/verification-gate/subtract-scope.test.ts
      - name: Merge-scope tripwire (#755)
        # Zero-dep plain node: guards the deleted-symbol class, the one-statement-
        # per-mechanism property for the seam and the reason vocabulary, and the
        # two anchors the rule's safety depends on (`:2204`'s tracking, and the
        # push/commit discrimination at the scope-resolution site).
        run: node extensions/verification-gate/test-subtract-scope.mjs
      - name: Loop-enforcer tier-bound parity (#723 — runtime caps vs canonical table)
        # VISIBLE, not merge-blocking (only pipeline-compliance is required).
        # The blocking backstop is ci-main.yml's extension-tests job, same
        # split as sequence-enforcer above.
        run: npx tsx extensions/loop-enforcer/tier-config-parity.test.ts
      - name: Shipped-default failover coverage pin (#715)
        # VISIBLE but NOT merge-blocking here: the repo's only required status
        # check is `pipeline-compliance`. The BLOCKING backstop is the
        # post-merge ci-main.yml `extensions/shared/*.test.ts` glob. Kept in
        # this job because it is zero-dependency (`node:*` +
        # ./provider-failover.js only, which imports `node:` only) — it must run
        # WITHOUT `npm ci`, which this job does not perform.
        run: npx tsx extensions/shared/default-coverage.test.ts
      - name: main-worktree-guard module-LOAD regression (#744)
        # The guard's bash-git classifier degraded SILENTLY in every session
        # from #697 until #744 (five rename-destructuring targets declared
        # nowhere → ReferenceError at module load, swallowed by the load
        # try/catch, leaving the fail-safe defaults for the bindings at or after
        # the abort point bound). No gate could see it: the
        # sibling extensions/main-worktree-guard/test.mjs imports
        # classify-git.mjs DIRECTLY, and the extensions/*/test*.mjs glob is
        # post-merge only (ci-main.yml). Its own step here, not a second
        # `test-command` line above — that value is pinned by
        # check-pi-pin-lockstep.mjs (guard (j)) to exactly this one accumulator
        # invocation.
        # Zero-dep (`node:*` + the `git` binary), no `npm ci`, ~30s.
        run: node extensions/main-worktree-guard/test-module-load.mjs
      - name: main-worktree-guard working-tree-discard gate (#709)
        # The discard family used to be gated on git ARGV, so `git checkout --
        # <path>` (the 2026-09-10 incident verb) classified `allow` and every
        # other discard verb was exempt in linked worktrees — exactly where the
        # `pi -p` review fixers run. #709 keys the gate on the EFFECT instead.
        # Behavioral: loads the REAL index.ts through module-load-hooks.mjs and
        # drives the tool_call handler against a hermetic hub + linked worktree.
        # Zero-dep (`node:*` + the `git` binary), no `npm ci`, ~5s. Its own
        # step (the post-merge `extensions/*/test*.mjs` glob in ci-main.yml is
        # not PR-triggered); perf-parity with the #744 step above.
        run: node extensions/main-worktree-guard/test-discard-gate.mjs
      - name: entry-point guard symlink regression (#708)
        # The entry-point idiom `pathToFileURL(process.argv[1]).href ===
        # import.meta.url` is symlink-SENSITIVE (pathToFileURL does no fs
        # resolution; the ESM loader realpaths import.meta.url), so ANY
        # symlinked invocation path made the guard body skip and the #254
        # fail-closed frontmatter gate exit 0 having printed NOTHING —
        # indistinguishable from a clean run. macOS `mktemp -d` is under `/var`
        # and every bootstrapped consumer repo symlinks `scripts/` (#387), so
        # this is the normal case, not an edge case.
        # Its own step (like #744/#709 above) because the
        # `extensions/*/test*.mjs` glob in ci-main.yml is POST-MERGE only.
        # Positive control: spawns the REAL gates through symlinked paths.
        # Zero-dep (`node:*` only), no `npm ci`, ~3s.
        run: node extensions/shared/test-is-main.mjs
      - name: Literal-path fence (no swarm abspath in skills/extensions/scripts)
        # Task 4 acceptance, CI-enforced: FAIL on a match. docs/ is excluded
        # (provenance).
        run: '! grep -rE ''/Users/danielospina/swarm/operations/coordination'' skills/ extensions/ scripts/'

  setup-suite:
    # #449 — pi-bootstrap setup regression suite, per-PR gate: the ONLY run-site
    # that catches the #447 ship-list drift class at PR time (previously the
    # parity suite ran nowhere in CI — the drift shipped silently and was found
    # by manual invocation only). Real setup.sh under a temp HOME, hermetic
    # (npm stubbed, launchctl shim, Darwin-gated assertions); ~2min.
    # Covers: no-nesting (#93), active-file refresh, farm-link preservation,
    # extensions/ content parity (single source of truth #95), launchd
    # isolation (#446).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pi-bootstrap setup regression suite
        run: bash pi-bootstrap/tests/test-setup-no-nesting.sh

  vendor-drift:
    # #383 — the SINGLE vendor drift gate: bash syntax + manifest verification
    # (identical@base sha256s + ledger patches reverse-apply to the swarm base).
    # Isolated as its own job so drift failures get their own red signal,
    # decoupled from the pytest/tsx suite. Verifies against the pinned
    # base_rev in scripts/.vendor-manifest.json; the private swarm checkout
    # (default branch, full history — the rev sits on main's history) provides
    # the base anchor. Requires AGENT_INFRA_READ_TOKEN (read access to
    # daniel-ospina/swarm) — the same cross-repo pattern as drift-check.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: daniel-ospina/swarm
          fetch-depth: 0
          path: swarm
          token: ${{ secrets.AGENT_INFRA_READ_TOKEN || github.token }}
      - name: Bash syntax check (vendored scripts + drift gate)
        run: bash -n scripts/checkout_guard.sh scripts/parallel_work_check.sh scripts/check-vendor-drift.sh
      - name: Vendor drift gate (manifest)
        env:
          SWARM_ROOT: ${{ github.workspace }}/swarm
        run: scripts/check-vendor-drift.sh --manifest
