name: CI
# Thin caller (#303) — delegates to the reusable node-ci workflow in
# agent-infra. Self-caller keeps @main (locked decision D2: same-commit,
# no tag-before-merge problem); consumers pin @vX.Y.Z instead.
# Budget: PR-only (shared Actions budget under daniel-ospina account)

on:
  pull_request:

jobs:
  ci:
    # node-ci.yml is materialized as a REAL file on this branch — GitHub
    # Actions cannot parse symlinked workflow files (#555); main's copy is
    # still a symlink, so the self-caller points at this branch during review.
    # Flip back to @main after merge (real file lands on main). #303 syncs
    # the full set via scripts/sync-ci-workflows.sh.
    uses: daniel-ospina/agent-infra/.github/workflows/node-ci.yml@feat/305-drift-ci
    secrets: inherit

  drift-check:
    # #305 — self-test of the drift-check CI gate. agent-infra's own checkout
    # is never bootstrapped (no committed AGENTS.md/.mcp.json/.husky pin — it's
    # the source), so this runs the fixture-based test suite: tiered exit codes
    # (structural fail / content warn / clean), stale-pin regression, and the
    # drift-check.yml YAML validity.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drift-check tests (tiered exits, fixtures, workflow YAML)
        run: bash tests/drift/run.sh
