[pytest]
# #2737 — pin this checkout as pytest's ROOT, so no `conftest.py` ABOVE the
# checkout is ever imported.
#
# THE MEASURED MECHANISM (pytest 9.1.1 — read from runs, not inferred). pytest's
# rootdir determination (`_pytest/config/findpaths.py::determine_setup`) walks UP
# from the invocation directory: it looks for a config file first (`pytest.ini`,
# `pyproject.toml` carrying `[tool.pytest.ini_options]`, `setup.cfg` with
# `[tool:pytest]`, `tox.ini` with `[pytest]`), and if it finds none it walks up
# again looking for `setup.py`. Whichever it finds CAPTURES the rootdir, and THAT
# directory's `conftest.py` is then loaded.
#
# So the exposure is not "no config file here" — it is "a config file ABOVE
# here". On a fleet box the checkout lives under the runner's work directory and
# the workspace's parent carries other lanes' debris: measured on cell c3-1,
# `/tmp/pyproject.toml` (a Tortoise one; `[tool.pytest.ini_options]` at line 284)
# and `/tmp/setup.py` both existed, so a run started in
# `/tmp/ai-runner-work-c3-1/agent-infra/agent-infra` captured rootdir at `/tmp`
# and imported `/tmp/conftest.py` — another project's 133 KB E2E conftest —
# dying with `ModuleNotFoundError: No module named 'httpx'`, a failure that says
# nothing about agent-infra. With NEITHER an inifile NOR a `setup.py` above it,
# the same geometry is GREEN: rootdir stays at the invocation's common ancestor
# and the parent conftest is never reached. That is why the red was
# intermittent — runs 40118809756 (cell c3-3) and 40122940309 (c3-1) both died
# this way while a run between them, on a cell without that debris, was green.
# A green run therefore proves nothing about the next cell, which is why the fix
# is immunity in the checkout and not a cleanup of somebody's /tmp.
#
# WHAT THIS FILE DOES. It is the NEAREST inifile to any run started inside this
# checkout, so rootdir — and the conftest cut that follows it — lands on the
# checkout whatever sits above. `tests/test_pytest_root_cut.py` proves it in both
# geometries: a run WITH this file stays in the checkout and never touches the
# parent's conftest, and the SAME tree WITHOUT it imports the parent's — with the
# parent debris planted by the test, so neither arm depends on the box.
#
# It is deliberately a `pytest.ini` and NOT a `pyproject.toml`/`setup.cfg`:
# those are packaging metadata, and this repo has none on purpose (python-ci's
# `install-extras: ''` skips the extras install). The file carries no options —
# its whole job is to exist and to win the nearest-inifile race. Adding options
# here changes collection semantics for every suite in the repo.
