# INERT: it cancels nothing and looks like an optimisation.
name: pr-group-sha
on:
  pull_request:
concurrency:
  group: pr-group-sha-${{ github.sha }}
  cancel-in-progress: true
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
