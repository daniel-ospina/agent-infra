# FAILURE-CLASS FIXTURE (R2, readability): a MULTI-LINE flow `on:` sequence. Reading only the first
# line drops `push`, so R2 is never evaluated and a cancelling run reports GREEN (round-2 P1).
name: push-multiline-flow
on: [pull_request,
  push]
concurrency:
  group: push-multiline-flow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
