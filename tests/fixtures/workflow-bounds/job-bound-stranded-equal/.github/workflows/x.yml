name: fixture job-bound-stranded-equal — a step bound EQUAL to the job bound
on:
  pull_request:
jobs:
  j:
    # Both cancel at 20 min, so the 20-min step bound can never fire. The note says "at or above", so the
    # equality edge must be reported (review finding, P3).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: at-the-edge
        timeout-minutes: 20
        run: echo hi
      - name: unbounded
        run: echo hi
